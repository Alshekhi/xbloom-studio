# xBloom dashboard — the helpers it needs
#
# Everything else on the dashboard comes from the xBloom integration. Create
# these three toggles first (Settings → Devices & services → Helpers → Create
# helper → Toggle), with exactly these entity ids, or add this under
# `input_boolean:` in configuration.yaml. Name them in your own language; only
# the entity ids matter.

input_boolean:
  xbloom_show_advanced:
    name: Show brew adjustments
    icon: mdi:tune-variant
  xbloom_show_per_pour:
    name: Show each pour
    icon: mdi:format-list-numbered
  xbloom_show_manual_brew:
    name: Show manual brew
    icon: mdi:coffee
