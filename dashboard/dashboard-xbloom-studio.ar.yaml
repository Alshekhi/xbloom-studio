# Built by dashboard/build.py — edit that, not this file.
views:
- title: التحضير
  path: brew
  icon: mdi:coffee
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## الآن'
    - type: tile
      entity: sensor.xbloom_studio_brew_status
      name:
        type: entity
      icon_tap_action:
        action: none
    - type: tile
      entity: binary_sensor.xbloom_studio_in_range
      name: الآلة
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_coffee_left
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unknown
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
    - type: tile
      entity: select.xbloom_studio_xpod_box
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: xpod
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unknown
    - type: tile
      entity: select.xbloom_studio_tea
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: tea
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unknown
    - type: tile
      entity: sensor.xbloom_studio_waiting_brews
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: numeric_state
        entity: sensor.xbloom_studio_waiting_brews
        above: 0
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## كيف كانت؟'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}**{{ e(states(''sensor.xbloom_studio_brew_to_rate'')) }}** مع {{
        e(state_attr(''sensor.xbloom_studio_brew_to_rate'', ''bag'')) }}{% set cs = state_attr(''sensor.xbloom_studio_brew_to_rate'',
        ''changes'') or [] %}{% if cs %}، {% for c in cs %}{% if c.setting == ''grind'' %}بدرجة طحن {{
        (c.value | float) | round(1) | string | replace(''.0'', '''') }} بدل {{ (c.saved | float) | round(1)
        | string | replace(''.0'', '''') }}{% elif c.setting == ''ratio'' %}بنسبة 1:{{ (c.value | float)
        | round(1) | string | replace(''.0'', '''') }} بدل 1:{{ (c.saved | float) | round(1) | string
        | replace(''.0'', '''') }}{% else %}بجرعة {{ (c.value | float) | round(1) | string | replace(''.0'',
        '''') }} غ بدل {{ (c.saved | float) | round(1) | string | replace(''.0'', '''') }} غ{% endif %}{%
        if not loop.last %}، {% endif %}{% endfor %}{% endif %}.'
    - type: tile
      entity: select.xbloom_studio_verdict
      name: الحكم
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_brew_to_rate
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_brew_to_rate
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## ما المشكلة'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}{{ e(state_attr(''select.xbloom_studio_what_was_wrong'', ''recipe''))
        }} مع {{ e(state_attr(''select.xbloom_studio_what_was_wrong'', ''bag'')) }}'
    - type: tile
      entity: select.xbloom_studio_what_was_wrong
      name: الإجابة
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    visibility:
    - condition: state
      entity: select.xbloom_studio_what_was_wrong
      state_not: unavailable
    - condition: state
      entity: select.xbloom_studio_what_was_wrong
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## هل تشتريه مجددًا؟'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}انتهى **{{ e(states(''sensor.xbloom_studio_finished_bag'')) }}**.'
    - type: tile
      entity: select.xbloom_studio_buy_again
      name: الإجابة
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_finished_bag
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_finished_bag
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## هل تحفظ هذا التعديل؟'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}**{{ e(states(''sensor.xbloom_studio_version_to_keep'')) }}** {%
        for c in state_attr(''sensor.xbloom_studio_version_to_keep'', ''changes'') or [] %}{% if c.setting
        == ''grind'' %}درجة طحن {{ (c.value | float) | round(1) | string | replace(''.0'', '''') }}{%
        elif c.setting == ''ratio'' %}1:{{ (c.value | float) | round(1) | string | replace(''.0'', '''')
        }}{% else %}{{ (c.value | float) | round(1) | string | replace(''.0'', '''') }} غ{% endif %}{%
        if not loop.last %}، {% endif %}{% endfor %} تستحق التكرار.'
    - type: tile
      entity: button.xbloom_studio_make_version_the_recipe
      name: حدّث الوصفة المحفوظة
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_make_version_the_recipe
        confirmation:
          text: تغيير الوصفة المحفوظة إلى هذه الإعدادات؟
    - type: tile
      entity: button.xbloom_studio_save_version_as_new_recipe
      name: احفظها كوصفة جديدة
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_save_version_as_new_recipe
    - type: tile
      entity: button.xbloom_studio_leave_recipe_unchanged
      name: أبقِ الوصفة كما هي
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_leave_recipe_unchanged
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_version_to_keep
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_version_to_keep
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## تحضير جار'
    - type: tile
      entity: sensor.xbloom_studio_current_recipe
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unknown
    - type: markdown
      text_only: true
      content: '{% set p = ''sensor.xbloom_studio_current_pour'' %}{% set total = state_attr(p, ''total_pours'')
        %}**الصبة {{ states(p) }}{% if total %} من {{ total }}{% endif %}**'
      visibility:
      - condition: numeric_state
        entity: sensor.xbloom_studio_current_pour
        above: 0
    - type: markdown
      text_only: true
      content: '{% set s = states(''sensor.xbloom_studio_brew_time'') | int(0) %}**زمن التحضير {{ s //
        60 }}:{{ ''%02d'' % (s % 60) }}**'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_brew_time
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_brew_time
        state_not: unknown
    - type: tile
      entity: button.xbloom_studio_pause_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_pause_brew
      visibility:
      - condition: state
        entity: binary_sensor.xbloom_studio_brew_paused
        state: 'off'
    - type: tile
      entity: button.xbloom_studio_resume_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_resume_brew
      visibility:
      - condition: state
        entity: binary_sensor.xbloom_studio_brew_paused
        state: 'on'
    - type: tile
      entity: button.xbloom_studio_cancel_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_cancel_brew
        confirmation:
          text: إيقاف التحضير الجاري؟
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: grinding
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## الكيس الحالي'
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
      hide_state: true
      tap_action:
        action: none
    - type: tile
      entity: select.xbloom_studio_xpod_box
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: xpod
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      hide_state: true
      tap_action:
        action: none
    - type: markdown
      text_only: true
      content: '{% set n = state_attr(''select.xbloom_studio_xpod_box'', ''pods_left'') %}{% if n is not
        none %}الكبسولات المتبقية: {{ n }}{% endif %}'
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: xpod
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unknown
    - type: tile
      entity: select.xbloom_studio_tea
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: tea
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unavailable
      hide_state: true
      tap_action:
        action: none
    - type: markdown
      content: '{% set a = states[''select.xbloom_studio_coffee_bag''].attributes if states[''select.xbloom_studio_coffee_bag'']
        else {} %}{{ [a.get(''roaster''), [a.get(''country''), a.get(''region'')] | select | join(''،
        ''), a.get(''process''), a.get(''varietal''), a.get(''roast'')] | select | join(''، '') }}{% if
        a.get(''roaster_notes'') %}


        {{ a.get(''roaster_notes'') }}{% endif %}'
      visibility:
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unknown
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
    - type: tile
      entity: sensor.xbloom_studio_last_brew_counted
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_last_brew_counted
        state: flagged
    - type: tile
      entity: button.xbloom_studio_refresh_coffee_bags
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_coffee_bags
      visibility:
      - condition: state
        entity: button.xbloom_studio_refresh_coffee_bags
        state_not: unavailable
    visibility:
    - condition: state
      entity: select.xbloom_studio_coffee_bag
      state_not: unavailable
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## وصفة لهذا الكيس'
    - type: tile
      entity: select.xbloom_studio_drink
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_suggest_recipe
      name: اقترح وصفة
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_suggest_recipe
    - type: tile
      entity: select.xbloom_studio_suggested_recipe
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: state
        entity: select.xbloom_studio_suggested_recipe
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_suggested_recipe
        state_not: unknown
      hide_state: true
      tap_action:
        action: none
    - type: markdown
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}{% set source = state_attr(''select.xbloom_studio_suggested_recipe'',
        ''source'') %}{% set chosen = states(''select.xbloom_studio_suggested_recipe'') %}{% set own =
        (state_attr(''sensor.xbloom_studio_recipe_suggestions'', ''own'') or []) | selectattr(''name'',
        ''eq'', chosen) | list %}{% if source == ''own'' and own %}{% set o = own[0] %}حُضّرت {% if o.brews
        == 1 %}مرة واحدة{% elif o.brews == 2 %}مرتين{% elif o.brews <= 10 %}{{ o.brews }} مرات{% else
        %}{{ o.brews }} مرة{% endif %} {% if o.matched == ''this_bag'' %}مع هذا الكيس{% elif o.matched
        == ''origin_process'' %}مع قهوة من {{ e(state_attr(''select.xbloom_studio_coffee_bag'', ''country''))
        }} بمعالجة {{ e(state_attr(''select.xbloom_studio_coffee_bag'', ''process'')) }}{% else %}مع قهوة
        من {{ e(state_attr(''select.xbloom_studio_coffee_bag'', ''country'')) }}{% endif %}.{% if o.versions
        %}


        النسخ مع هذا الكيس: {% for v in o.versions %}{{ [((''درجة طحن '' ~ ((v.grind | float) | round(1)
        | string | replace(''.0'', '''')) ~ '''') if v.grind is not none else ''''), ((''1:'' ~ ((v.ratio
        | float) | round(1) | string | replace(''.0'', '''')) ~ '''') if v.ratio is not none else ''''),
        (('''' ~ ((v.dose_g | float) | round(1) | string | replace(''.0'', '''')) ~ '' غ'') if v.dose_g
        is not none else '''')] | select | join(''، '') }} — {% if v.verdict == ''again'' %}أكرّرها{%
        elif v.verdict == ''fine'' %}لا بأس بها{% else %}لن أكرّرها{% endif %}{% if not loop.last %};
        {% endif %}{% endfor %}.{% endif %}{% elif source == ''community'' %}من المجتمع، شاركها {{ ''xBloom''
        if state_attr(''select.xbloom_studio_suggested_recipe'', ''official'') else e(state_attr(''select.xbloom_studio_suggested_recipe'',
        ''author'')) }}. استخدامها يضيفها إلى وصفاتك.{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_suggestions
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_recipe_suggestions
        state_not: unknown
    - type: tile
      entity: button.xbloom_studio_use_suggested_recipe
      name: استخدم هذه الوصفة
