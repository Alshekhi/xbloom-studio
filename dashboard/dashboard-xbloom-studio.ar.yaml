        ''\\\\\\1'') }}{% endmacro %}{% set a = states[''sensor.xbloom_studio_for_you''].attributes if
        states[''sensor.xbloom_studio_for_you''] is defined else {} %}### {{ e(states(''sensor.xbloom_studio_for_you''))
        }}


        {% set tea = (a.get(''cup'') or '''') | lower == ''tea'' %}{% set c = a.get(''coffee'') or {}
        %}{% if c.get(''name'') %}**{% if tea %}الشاي{% else %}الكبسولة{% endif %}:** {{ e(c.get(''name''))
        }}{% for x in [c.get(''origin''), c.get(''process''), c.get(''varietal'')] if x and (x | upper)
        != ''NONE'' %}، {{ e(x) }}{% endfor %}


        {% set notes = c.get(''flavor'') or '''' %}{% if notes and (notes | upper) != ''NONE'' %}**النكهات:**
        {{ e(notes | regex_replace(''\s*·\s*'', ''، '')) }}


        {% endif %}{% endif %}{% set tea = (a.get(''cup'') or '''') | lower == ''tea'' %}{% if a.get(''dose_g'')
        %}**{% if tea %}الشاي{% else %}القهوة{% endif %}:** {{ (a.get(''dose_g'') | float) | round(1)
        | string | replace(''.0'', '''') }} غ{% if a.get(''ratio'') %}، **النسبة:** 1:{{ (a.get(''ratio'')
        | float) | round(1) | string | replace(''.0'', '''') }}{% endif %}{% if a.get(''grind_size'')
        and not tea %}، درجة الطحن {{ a.get(''grind_size'') | round(0) | int }} بسرعة {{ a.get(''rpm'')
        }} دورة في الدقيقة{% endif %}


        {% endif %}{% set pours = a.get(''pours'') or [] %}{% if pours %}| الصبة | الماء | الحرارة | الانتظار
        |

        |:--:|:--:|:--:|:--:|

