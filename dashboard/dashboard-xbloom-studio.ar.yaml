# Built by dashboard/build.py — edit that, not this file.
views:
- title: التحضير
  path: brew
  icon: mdi:coffee
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## الآن'
    - type: tile
      entity: sensor.xbloom_studio_brew_status
      icon_tap_action:
        action: none
    - type: tile
      entity: binary_sensor.xbloom_studio_in_range
      icon_tap_action:
        action: none
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unknown
    - type: tile
      entity: sensor.xbloom_studio_coffee_left
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unknown
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## تحضير جار'
    - type: tile
      entity: sensor.xbloom_studio_current_recipe
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unknown
    - type: tile
      entity: sensor.xbloom_studio_current_pour
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_pause_brew
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_pause_brew
    - type: tile
      entity: button.xbloom_studio_resume_brew
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_resume_brew
    - type: tile
      entity: button.xbloom_studio_cancel_brew
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_cancel_brew
        confirmation:
          text: إيقاف التحضير الجاري؟
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: grinding
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## الكيس الحالي'
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      icon_tap_action:
        action: none
      features:
      - type: select-options
    - type: markdown
      content: '{% set a = states[''select.xbloom_studio_coffee_bag''].attributes if states[''select.xbloom_studio_coffee_bag'']
        else {} %}{{ [a.get(''roaster''), [a.get(''country''), a.get(''region'')] | select | join(''،
        ''), a.get(''process'')] | select | join('' · '') }}{% if a.get(''roaster_notes'') %}


        {{ a.get(''roaster_notes'') }}{% endif %}'
      visibility:
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unknown
    - type: tile
      entity: sensor.xbloom_studio_last_brew_counted
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_last_brew_counted
        state: flagged
    visibility:
    - condition: state
      entity: select.xbloom_studio_coffee_bag
      state_not: unavailable
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## التحضير بماكينة xBloom'
    - type: tile
      entity: select.xbloom_studio_recipe
      icon_tap_action:
        action: none
      features:
      - type: select-options
    - type: tile
      entity: button.xbloom_studio_start_brew
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_start_brew
      grid_options:
        columns: 6
    - type: tile
      entity: button.xbloom_studio_refresh_recipes
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_recipes
      grid_options:
        columns: 6
    - type: tile
      entity: button.xbloom_studio_refresh_coffee_bags
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_coffee_bags
      visibility:
      - condition: state
        entity: button.xbloom_studio_refresh_coffee_bags
        state_not: unavailable
    - type: tile
      entity: input_boolean.xbloom_show_advanced
      icon_tap_action:
        action: none
      tap_action:
        action: toggle
      name: إظهار تعديلات التحضير
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## التحضير بماكينة xBloom'
    - type: markdown
      text_only: true
      content: أعد الماكينة إلى شاشتها الرئيسية لتحضير وصفة.
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: sensor.xbloom_studio_current_module
        state: grinder
      - condition: state
        entity: sensor.xbloom_studio_current_module
        state: brewer
      - condition: state
        entity: sensor.xbloom_studio_current_module
        state: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## تعديل هذا التحضير'
    - type: tile
      entity: switch.xbloom_studio_use_grinder
      icon_tap_action:
        action: none
      tap_action:
        action: toggle
    - type: tile
      entity: number.xbloom_studio_brew_grind_size
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
      visibility:
      - condition: state
        entity: switch.xbloom_studio_use_grinder
        state: 'on'
    - type: tile
      entity: number.xbloom_studio_brew_ratio
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
    - type: tile
      entity: number.xbloom_studio_brew_dose
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
      visibility:
      - condition: state
        entity: number.xbloom_studio_brew_dose
        state_not: unavailable
      - condition: state
        entity: number.xbloom_studio_brew_dose
        state_not: unknown
    - type: markdown
      content: '{% set rdose = state_attr(''select.xbloom_studio_recipe'',''dose_g'') | float(0) %}

        {% set dose = states(''number.xbloom_studio_brew_dose'') | float(rdose) %}

        {% set ratio = states(''number.xbloom_studio_brew_ratio'') | float(0) %}

        {% set water = dose * ratio %}

        {% set wu = states(''select.xbloom_studio_weight_unit'') %}

        ### هذا التحضير

        {% if wu == ''oz'' %}- **القهوة:** {{ (dose * 0.035274) | round(2) }} oz

        - **الماء:** {{ (water * 0.033814) | round(1) }} oz

        {% else %}- **القهوة:** {{ dose | round(1) }} غ

        - **الماء:** {{ water | round(0) | int }} مل

        {% endif %}- **النسبة:** 1:{{ ratio | round(1) }}'
    - type: tile
      entity: input_boolean.xbloom_show_per_pour
      icon_tap_action:
        action: none
      tap_action:
        action: toggle
      name: إظهار كل صبة
    - type: markdown
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_per_pour
        state: 'on'
      content: '{% set pours = state_attr(''select.xbloom_studio_recipe'',''pours'') or [] %}

        {% set rdose = state_attr(''select.xbloom_studio_recipe'',''dose_g'') | float(0) %}

        {% set dose = states(''number.xbloom_studio_brew_dose'') | float(rdose) %}

        {% set ratio = states(''number.xbloom_studio_brew_ratio'') | float(0) %}

        {% set ns = namespace(orig=0) %}

        {% for p in pours %}{% set ns.orig = ns.orig + (p.volume_ml | float(0)) %}{% endfor %}

        {% set factor = (dose * ratio / ns.orig) if ns.orig > 0 else 0 %}

        {% set tu = states(''select.xbloom_studio_temperature_unit'') %}

        {% set wu = states(''select.xbloom_studio_weight_unit'') %}

        {% if pours %}| الصبة | الماء | الحرارة |

        |:--:|:--:|:--:|

        {% for p in pours %}| {{ loop.index }} | {% set v = (p.volume_ml | float(0)) * factor %}{% if
        wu == ''oz'' %}{{ (v * 0.033814) | round(2) }} oz{% else %}{{ v | round(0) | int }} مل{% endif
        %} | {% set c = p.temperature_c | float(0) %}{% if tu == ''f'' %}{{ (c * 9 / 5 + 32) | round(0)
        | int }}°F{% else %}{{ c | round(0) | int }}°C{% endif %} |

        {% endfor %}{% else %}_اختر وصفة لعرض صباتها._{% endif %}'
    visibility:
    - condition: state
      entity: input_boolean.xbloom_show_advanced
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## حفظ كوصفة جديدة'
    - type: tile
      entity: text.xbloom_studio_new_recipe_name
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_save_as_new_recipe
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_save_as_new_recipe
    visibility:
    - condition: state
      entity: input_boolean.xbloom_show_advanced
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## تحضير يدوي'
    - type: tile
      entity: input_boolean.xbloom_show_manual_brew
      icon_tap_action:
        action: none
      tap_action:
        action: toggle
      name: إظهار التحضير اليدوي
    - type: tile
      entity: select.xbloom_studio_manual_brewer
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_manual_brew
        state: 'on'
      grid_options:
        columns: 6
    - type: tile
      entity: number.xbloom_studio_manual_brew_dose
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_manual_brew
        state: 'on'
      grid_options:
        columns: 6
    - type: tile
      entity: button.xbloom_studio_record_manual_brew
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_record_manual_brew
        confirmation:
          text: تسجيل هذا التحضير اليدوي؟
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_manual_brew
        state: 'on'
    - type: tile
      entity: sensor.xbloom_studio_last_brew_counted
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_manual_brew
        state: 'on'
      - condition: state
        entity: sensor.xbloom_studio_last_brew_counted
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_last_brew_counted
        state_not: unknown
    visibility:
    - condition: state
      entity: select.xbloom_studio_manual_brewer
      state_not: unavailable
- title: الإحصاءات
  path: stats
  icon: mdi:chart-bar
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## إحصاءات القهوة'
    - type: tile
      entity: select.xbloom_studio_stats_period
      icon_tap_action:
        action: none
      features:
      - type: select-options
    - type: tile
      entity: sensor.xbloom_studio_brews
      icon_tap_action:
        action: none
    - type: markdown
      content: '{% set a = states[''sensor.xbloom_studio_brews''].attributes if states[''sensor.xbloom_studio_brews'']
        else {} %}- **القهوة المستخدمة:** {{ a.get(''coffee_g'', 0) | round(0) | int }} غ

        {% if a.get(''water_ml'') %}- **الماء المستخدم:** {{ a.get(''water_ml'') | round(0) | int }} مل

        {% endif %}- **التحضيرات في الفترة السابقة:** {{ (a.get(''previous_period'') or {}).get(''brews'',
        0) }}'
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_brews
      state_not: unavailable
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## حسب أداة التحضير'
    - type: markdown
      content: '{% for name, n in (state_attr(''sensor.xbloom_studio_brews'',''by_brewer'') or {}).items()
        %}- **{{ ''أخرى'' if name == ''other'' else name }}**: {{ n }}

        {% endfor %}'
    visibility:
    - condition: numeric_state
      entity: sensor.xbloom_studio_brews
      above: 0
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## سجل التحضير'
    - type: statistics-graph
      title: التحضيرات يوميا
      chart_type: bar
      period: day
      days_to_show: 30
      stat_types:
      - change
      entities:
      - entity: xbloom:brews_xbloom
        name: xBloom
      - entity: xbloom:brews_manual
        name: يدوي
    - type: statistics-graph
      title: التحضيرات شهريا
      chart_type: bar
      period: month
      days_to_show: 365
      stat_types:
      - change
      entities:
      - entity: xbloom:brews_xbloom
        name: xBloom
      - entity: xbloom:brews_manual
        name: يدوي
    - type: statistics-graph
      title: القهوة المستخدمة أسبوعيا
      chart_type: bar
      period: week
      days_to_show: 90
      stat_types:
      - change
      entities:
      - entity: xbloom:coffee_used
        name: القهوة المستخدمة
    - type: statistics-graph
      title: الماء المستخدم أسبوعيا
      chart_type: bar
      period: week
      days_to_show: 90
      stat_types:
      - change
      entities:
      - entity: xbloom:water_brewed
        name: الماء المستخدم
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_brews
      state_not: unavailable
- title: الأكياس
  path: bags
  icon: mdi:shopping
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## الأكياس المتوفرة'
    - type: markdown
      content: '{% set current = state_attr(''select.xbloom_studio_coffee_bag'',''id'') %}{% for b in
        state_attr(''sensor.xbloom_studio_coffee_bags'',''bags'') or [] %}- **{{ b.name }}**{{ '' (قيد
        الاستخدام)'' if b.id == current }} — {{ ''غير مفتوح'' if b.status == ''unopened'' else ''مفتوح''
        }}، {{ (b.remaining_g | round(0) | int ~ '' غ متبقية'') if b.remaining_g is not none else ''غير
        متتبع'' }}

        {% else %}لا توجد أكياس مفتوحة أو غير مفتوحة.{% endfor %}'
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      icon_tap_action:
        action: none
      features:
      - type: select-options
    - type: tile
      entity: button.xbloom_studio_refresh_coffee_bags
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_coffee_bags
      visibility:
      - condition: state
        entity: button.xbloom_studio_refresh_coffee_bags
        state_not: unavailable
    - type: markdown
      text_only: true
      content: '[إضافة الأكياس أو تعديلها](/config/integrations/integration/xbloom)'
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_coffee_bags
      state_not: unavailable
