        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_use_suggested_recipe
      visibility:
      - condition: state
        entity: select.xbloom_studio_suggested_recipe
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_suggested_recipe
        state_not: unknown
    visibility:
    - condition: state
      entity: select.xbloom_studio_coffee_bag
      state_not: unavailable
    - condition: state
      entity: select.xbloom_studio_coffee_bag
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## التحضير بماكينة xBloom'
    - type: tile
      entity: select.xbloom_studio_recipe
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}في المرة السابقة أردت: **{% set s = state_attr(''sensor.xbloom_studio_next_change'',
        ''settings'') or {} %}{% if s %}{% for k, v in s.items() %}{% if k == ''grind'' %}درجة طحن {{
        (v | float) | round(1) | string | replace(''.0'', '''') }}{% elif k == ''ratio'' %}نسبة 1:{{ (v
        | float) | round(1) | string | replace(''.0'', '''') }}{% else %}{{ (v | float) | round(1) | string
        | replace(''.0'', '''') }} غ من البن{% endif %}{% if not loop.last %}، {% endif %}{% endfor %}{%
        else %}{{ e(states(''sensor.xbloom_studio_next_change'')) }}{% endif %}**.'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_next_change
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_next_change
        state_not: unknown
    - type: tile
      entity: button.xbloom_studio_use_next_change
      name: استخدم هذا التعديل
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_use_next_change
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_next_change
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_next_change
        state_not: unknown
    - type: markdown
