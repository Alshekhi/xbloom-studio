# Built by dashboard/build.py — edit that, not this file.
views:
- title: التحضير
  path: brew
  icon: mdi:coffee
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## الآن'
    - type: tile
      entity: sensor.xbloom_studio_brew_status
      name:
        type: entity
      icon_tap_action:
        action: none
    - type: tile
      entity: binary_sensor.xbloom_studio_in_range
      name: الآلة
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_coffee_left
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unknown
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
    - type: tile
      entity: select.xbloom_studio_xpod_box
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: xpod
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unknown
    - type: tile
      entity: select.xbloom_studio_tea
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: tea
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unknown
    - type: markdown
      text_only: true
      content: '{% set m = state_attr(''sensor.xbloom_studio_coffee_stock'', ''measure'') %}{% set least
        = state_attr(''sensor.xbloom_studio_coffee_stock'', ''at_least'') %}{% set n = ((least if least
        is not none else states(''sensor.xbloom_studio_coffee_stock'')) | float(0) | round(0) | int) %}{%
        if n == 0 and least is none %}نفد مخزون القهوة.{% else %}مخزون القهوة منخفض، والمتبقي {% if m
        == ''days'' %}{% if least is not none %}{% if n == 1 %}يوم واحد{% elif n == 2 %}يومان{% elif 3
        <= n <= 10 %}{{ n }} أيام{% else %}{{ n }} يومًا{% endif %} على الأقل{% else %}{% if n == 1 %}يوم
        واحد{% elif n == 2 %}يومان{% elif 3 <= n <= 10 %}{{ n }} أيام{% else %}{{ n }} يومًا{% endif %}
        تقريبًا{% endif %}{% elif m == ''grams'' %}{% if least is not none %}{{ n }} غ على الأقل{% else
        %}{{ n }} غ{% endif %}{% elif m == ''cups'' %}{% if least is not none %}{% if n == 1 %}كوب واحد{%
        elif n == 2 %}كوبان{% elif 3 <= n <= 10 %}{{ n }} أكواب{% else %}{{ n }} كوبًا{% endif %} على
        الأقل{% else %}{% if n == 1 %}كوب واحد{% elif n == 2 %}كوبان{% elif 3 <= n <= 10 %}{{ n }} أكواب{%
        else %}{{ n }} كوبًا{% endif %} تقريبًا{% endif %}{% elif m == ''bags'' %}{% if least is not none
        %}{% if n == 1 %}كيس واحد{% elif n == 2 %}كيسان{% elif 3 <= n <= 10 %}{{ n }} أكياس{% else %}{{
        n }} كيسًا{% endif %} على الأقل{% else %}{% if n == 1 %}كيس واحد{% elif n == 2 %}كيسان{% elif
        3 <= n <= 10 %}{{ n }} أكياس{% else %}{{ n }} كيسًا{% endif %}{% endif %}{% endif %}.{% endif
        %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
      - condition: state
        entity: binary_sensor.xbloom_studio_coffee_stock_low
        state: 'on'
    - type: markdown
      text_only: true
      content: '{% set m = state_attr(''sensor.xbloom_studio_tea_stock'', ''measure'') %}{% set least
        = state_attr(''sensor.xbloom_studio_tea_stock'', ''at_least'') %}{% set n = ((least if least is
        not none else states(''sensor.xbloom_studio_tea_stock'')) | float(0) | round(0) | int) %}{% if
        n == 0 and least is none %}نفد مخزون الشاي.{% else %}مخزون الشاي منخفض، والمتبقي {% if m == ''days''
        %}{% if least is not none %}{% if n == 1 %}يوم واحد{% elif n == 2 %}يومان{% elif 3 <= n <= 10
        %}{{ n }} أيام{% else %}{{ n }} يومًا{% endif %} على الأقل{% else %}{% if n == 1 %}يوم واحد{%
        elif n == 2 %}يومان{% elif 3 <= n <= 10 %}{{ n }} أيام{% else %}{{ n }} يومًا{% endif %} تقريبًا{%
        endif %}{% elif m == ''grams'' %}{% if least is not none %}{{ n }} غ على الأقل{% else %}{{ n }}
        غ{% endif %}{% elif m == ''cups'' %}{% if least is not none %}{% if n == 1 %}كوب واحد{% elif n
        == 2 %}كوبان{% elif 3 <= n <= 10 %}{{ n }} أكواب{% else %}{{ n }} كوبًا{% endif %} على الأقل{%
        else %}{% if n == 1 %}كوب واحد{% elif n == 2 %}كوبان{% elif 3 <= n <= 10 %}{{ n }} أكواب{% else
        %}{{ n }} كوبًا{% endif %} تقريبًا{% endif %}{% elif m == ''bags'' %}{% if least is not none %}{%
        if n == 1 %}عبوة واحدة{% elif n == 2 %}عبوتان{% elif 3 <= n <= 10 %}{{ n }} عبوات{% else %}{{
        n }} عبوة{% endif %} على الأقل{% else %}{% if n == 1 %}عبوة واحدة{% elif n == 2 %}عبوتان{% elif
        3 <= n <= 10 %}{{ n }} عبوات{% else %}{{ n }} عبوة{% endif %}{% endif %}{% endif %}.{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: tea
      - condition: state
        entity: binary_sensor.xbloom_studio_tea_stock_low
        state: 'on'
    - type: markdown
      text_only: true
      content: '{% set m = state_attr(''sensor.xbloom_studio_xpod_stock'', ''measure'') %}{% set least
        = state_attr(''sensor.xbloom_studio_xpod_stock'', ''at_least'') %}{% set n = ((least if least
        is not none else states(''sensor.xbloom_studio_xpod_stock'')) | float(0) | round(0) | int) %}{%
        if n == 0 and least is none %}نفد مخزون كبسولات xPod.{% else %}مخزون كبسولات xPod منخفض، والمتبقي
        {% if m == ''days'' %}{% if least is not none %}{% if n == 1 %}يوم واحد{% elif n == 2 %}يومان{%
        elif 3 <= n <= 10 %}{{ n }} أيام{% else %}{{ n }} يومًا{% endif %} على الأقل{% else %}{% if n
        == 1 %}يوم واحد{% elif n == 2 %}يومان{% elif 3 <= n <= 10 %}{{ n }} أيام{% else %}{{ n }} يومًا{%
        endif %} تقريبًا{% endif %}{% elif m == ''pods'' %}{% if least is not none %}{% if n == 1 %}كبسولة
        واحدة{% elif n == 2 %}كبسولتان{% elif 3 <= n <= 10 %}{{ n }} كبسولات{% else %}{{ n }} كبسولة{%
        endif %} على الأقل{% else %}{% if n == 1 %}كبسولة واحدة{% elif n == 2 %}كبسولتان{% elif 3 <= n
        <= 10 %}{{ n }} كبسولات{% else %}{{ n }} كبسولة{% endif %}{% endif %}{% elif m == ''boxes'' %}{%
        if least is not none %}{% if n == 1 %}علبة واحدة{% elif n == 2 %}علبتان{% elif 3 <= n <= 10 %}{{
        n }} علب{% else %}{{ n }} علبة{% endif %} على الأقل{% else %}{% if n == 1 %}علبة واحدة{% elif
        n == 2 %}علبتان{% elif 3 <= n <= 10 %}{{ n }} علب{% else %}{{ n }} علبة{% endif %}{% endif %}{%
        endif %}.{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: xpod
      - condition: state
        entity: binary_sensor.xbloom_studio_xpod_stock_low
        state: 'on'
    - type: tile
      entity: sensor.xbloom_studio_waiting_brews
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: numeric_state
        entity: sensor.xbloom_studio_waiting_brews
        above: 0
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## كيف كانت؟'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}**{{ e(states(''sensor.xbloom_studio_brew_to_rate'')) }}** مع {{
        e(state_attr(''sensor.xbloom_studio_brew_to_rate'', ''bag'')) }}{% set cs = state_attr(''sensor.xbloom_studio_brew_to_rate'',
        ''changes'') or [] %}{% if cs %}، {% for c in cs %}{% if c.setting == ''grind'' %}بدرجة طحن {{
        (c.value | float) | round(1) | string | replace(''.0'', '''') }} بدل {{ (c.saved | float) | round(1)
        | string | replace(''.0'', '''') }}{% elif c.setting == ''ratio'' %}بنسبة 1:{{ (c.value | float)
        | round(1) | string | replace(''.0'', '''') }} بدل 1:{{ (c.saved | float) | round(1) | string
        | replace(''.0'', '''') }}{% else %}بجرعة {{ (c.value | float) | round(1) | string | replace(''.0'',
        '''') }} غ بدل {{ (c.saved | float) | round(1) | string | replace(''.0'', '''') }} غ{% endif %}{%
        if not loop.last %}، {% endif %}{% endfor %}{% endif %}.{% set f = state_attr(''sensor.xbloom_studio_brew_to_rate'',
        ''focus'') %}{% if f %}


        {{ e(f) }}{% endif %}'
    - type: tile
      entity: select.xbloom_studio_verdict
      name: الحكم
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_brew_to_rate
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_brew_to_rate
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## ما المشكلة'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}{{ e(state_attr(''select.xbloom_studio_what_was_wrong'', ''recipe''))
        }} مع {{ e(state_attr(''select.xbloom_studio_what_was_wrong'', ''bag'')) }}'
    - type: tile
      entity: select.xbloom_studio_what_was_wrong
      name: الإجابة
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    visibility:
    - condition: state
      entity: select.xbloom_studio_what_was_wrong
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## هل تشتريه مجددًا؟'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}انتهى **{{ e(states(''sensor.xbloom_studio_finished_bag'')) }}**.'
    - type: tile
      entity: select.xbloom_studio_buy_again
      name: الإجابة
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_finished_bag
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_finished_bag
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## هل تحفظ هذا التعديل؟'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}**{{ e(states(''sensor.xbloom_studio_version_to_keep'')) }}** {%
        for c in state_attr(''sensor.xbloom_studio_version_to_keep'', ''changes'') or [] %}{% if c.setting
        == ''grind'' %}درجة طحن {{ (c.value | float) | round(1) | string | replace(''.0'', '''') }}{%
        elif c.setting == ''ratio'' %}1:{{ (c.value | float) | round(1) | string | replace(''.0'', '''')
        }}{% else %}{{ (c.value | float) | round(1) | string | replace(''.0'', '''') }} غ{% endif %}{%
        if not loop.last %}، {% endif %}{% endfor %} تستحق التكرار.'
    - type: tile
      entity: button.xbloom_studio_make_version_the_recipe
      name: حدّث الوصفة المحفوظة
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_make_version_the_recipe
        confirmation:
          text: تغيير الوصفة المحفوظة إلى هذه الإعدادات؟
    - type: tile
      entity: button.xbloom_studio_save_version_as_new_recipe
      name: احفظها كوصفة جديدة
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_save_version_as_new_recipe
    - type: tile
      entity: button.xbloom_studio_leave_recipe_unchanged
      name: أبقِ الوصفة كما هي
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_leave_recipe_unchanged
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_version_to_keep
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_version_to_keep
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## تحضير جار'
    - type: tile
      entity: sensor.xbloom_studio_current_recipe
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unknown
    - type: markdown
      text_only: true
      content: '{% set p = ''sensor.xbloom_studio_current_pour'' %}{% set total = state_attr(p, ''total_pours'')
        %}{% set stage = states(''sensor.xbloom_studio_brew_stage'') %}{% if stage == ''waiting'' %}**انتظار
        بعد الصبة {{ states(p) }}**{% elif stage == ''draining'' %}**قيد التقطير**{% else %}**الصبة {{
        states(p) }}{% if total %} من {{ total }}{% endif %}**{% endif %}'
      visibility:
      - condition: numeric_state
        entity: sensor.xbloom_studio_current_pour
        above: 0
    - type: tile
      entity: sensor.xbloom_studio_next_pour
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_next_pour
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_next_pour
        state_not: unknown
    - type: markdown
      text_only: true
      show_empty: false
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}{% set s = ''sensor.xbloom_studio_brew_story'' %}{% if state_attr(s,
        ''now'') %}{{ e(state_attr(s, ''now'')) }}{% endif %}{% if state_attr(s, ''story'') %}


        **{{ e(states(s)) }}**


        {{ e(state_attr(s, ''story'')) }}{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_brew_stage
        state:
        - pouring
        - waiting
        - draining
    - type: markdown
      text_only: true
      content: '{% set s = states(''sensor.xbloom_studio_brew_time'') | int(0) %}**زمن التحضير {{ s //
        60 }}:{{ ''%02d'' % (s % 60) }}**'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_brew_time
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_brew_time
        state_not: unknown
    - type: markdown
      text_only: true
      content: '{% set n = states(''sensor.xbloom_studio_water_poured'') | int(0) %}{% set total = state_attr(''sensor.xbloom_studio_water_poured'',
        ''recipe_water_ml'') %}{% macro ml(n) %}{{ n }} {{ ''مليلتر'' if n % 100 <= 2 else (''مليلترات''
        if n % 100 <= 10 else ''مليلترًا'') }}{% endmacro %}**الماء المصبوب:** {% if total %}{{ n }} من
        {{ ml(total) }}{% else %}{{ ml(n) }}{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_water_poured
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_water_poured
        state_not: unknown
    - type: markdown
      text_only: true
      show_empty: false
      content: '{% set a = states[''sensor.xbloom_studio_machine_status''].attributes if states[''sensor.xbloom_studio_machine_status'']
        else {} %}{% set left = a.get(''water_left_ml'') %}{% if left is number %}{% set short = [a.get(''water_needed_ml'',
        0) - left, 0] | max %}{% macro ml(n) %}{{ n }} {{ ''مليلتر'' if n % 100 <= 2 else (''مليلترات''
        if n % 100 <= 10 else ''مليلترًا'') }}{% endmacro %}**الماء:** {% if left > 0 %}بقي {{ ml(left)
        }}{% else %}نفد{% endif %}، {% if a.get(''water_enough_to_finish'') %}يكفي لإكمال الوصفة{% else
        %}ينقص {{ ml(short) }}{% endif %}{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_machine_status
        state: no_water
    - type: tile
      entity: button.xbloom_studio_pause_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_pause_brew
      visibility:
      - condition: state
        entity: binary_sensor.xbloom_studio_brew_paused
        state: 'off'
    - type: tile
      entity: button.xbloom_studio_resume_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_resume_brew
      visibility:
      - condition: state
        entity: binary_sensor.xbloom_studio_brew_paused
        state: 'on'
    - type: tile
      entity: button.xbloom_studio_cancel_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_cancel_brew
        confirmation:
          text: إيقاف التحضير الجاري؟
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: grinding
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## الكيس الحالي'
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
      hide_state: true
      tap_action:
        action: none
    - type: tile
      entity: select.xbloom_studio_xpod_box
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: xpod
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      hide_state: true
      tap_action:
        action: none
    - type: markdown
      text_only: true
      content: '{% set n = state_attr(''select.xbloom_studio_xpod_box'', ''pods_left'') %}{% if n is not
        none %}الكبسولات المتبقية: {{ n }}{% endif %}'
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: xpod
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      - condition: state
