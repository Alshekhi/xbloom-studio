  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Chosen recipe'
    - type: markdown
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}{% set a = state_attr(''select.xbloom_studio_community_recipe'',
        ''picked'') or {} %}{% set added = state_attr(''select.xbloom_studio_community_recipe'', ''added'')
        %}{% if added %}Added to your recipes as **{{ e(added) }}**. Pick it on the Brew tab.


        {% endif %}{% if state_attr(''select.xbloom_studio_community_recipe'', ''suggested'') %}{% if
        state_attr(''select.xbloom_studio_community_recipe'', ''suggested_for'') and state_attr(''select.xbloom_studio_community_recipe'',
        ''matched_origin'') %}Suggested for **{{ e(state_attr(''select.xbloom_studio_community_recipe'',
        ''suggested_for'')) }}**, matching {{ e(state_attr(''select.xbloom_studio_community_recipe'',
        ''matched_origin'')) }}{% if state_attr(''select.xbloom_studio_community_recipe'', ''matched_process'')
        %} · {{ e(state_attr(''select.xbloom_studio_community_recipe'', ''matched_process'')) }}{% endif
        %}.{% else %}The most downloaded Studio recipes.{% endif %}


        {% endif %}Shared by {{ ''xBloom'' if a.get(''official'') else e(a.get(''author'')) }}{% set about
        = (a.get(''origin'') or []) + (a.get(''process'') or []) + (a.get(''varietal'') or []) + ([a.get(''roast'')]
        if a.get(''roast'') else []) %}{% if about %} · {% for x in about %}{{ e(x) }}{% if not loop.last
        %} · {% endif %}{% endfor %}{% endif %}{% if a.get(''likes'') %} · {{ a.get(''likes'') }} likes{%
        endif %}


        {% if a.get(''flavor'') %}**Tasting notes:** {% for x in a.get(''flavor'') %}{{ e(x) }}{% if not
        loop.last %}, {% endif %}{% endfor %}


        {% endif %}{% set fits = a.get(''fits'') or {} %}{% if fits %}**Same as this bag:** {{ [(''process''
        if fits.get(''process'') else ''''), (''variety'' if fits.get(''varietal'') else ''''), (''roast''
        if fits.get(''roast'') else ''''), (''tasting notes'' if fits.get(''flavor'') else '''')] | select
        | join('', '') }}


        {% endif %}{% if a.get(''description'') %}{{ e(a.get(''description'')) }}


        {% endif %}{% if a.get(''dose_g'') %}**Coffee:** {{ a.get(''dose_g'') | round(1) }} g{% if a.get(''ratio'')
        %} · **Ratio:** 1:{{ a.get(''ratio'') | round(1) }}{% endif %}{% if a.get(''grind_size'') %} ·
        grind {{ a.get(''grind_size'') | round(0) | int }} at {{ a.get(''rpm'') }} RPM{% endif %}


        {% endif %}{% set pours = a.get(''pours'') or [] %}{% if pours %}| Pour | Water | Temp | Pause
        |

        |:--:|:--:|:--:|:--:|

        {% for p in pours %}| {{ loop.index }} | {{ p.volume_ml | round(0) | int }} ml | {{ p.temperature_c
        | round(0) | int }}°C | {{ p.pause_s | int(0) }} s |

        {% endfor %}{% endif %}'
    - type: tile
      entity: button.xbloom_studio_add_community_recipe
