# Built by dashboard/build.py — edit that, not this file.
views:
- title: Brew
  path: brew
  icon: mdi:coffee
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Right now'
    - type: tile
      entity: sensor.xbloom_studio_brew_status
      name:
        type: entity
      icon_tap_action:
        action: none
    - type: tile
      entity: binary_sensor.xbloom_studio_in_range
      name:
        type: entity
      icon_tap_action:
        action: none
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unknown
      - &id001
        condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - &id002
        condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
    - type: tile
      entity: sensor.xbloom_studio_coffee_left
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unknown
      - *id001
      - *id002
    - type: tile
      entity: select.xbloom_studio_xpod_box
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: xpod
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unknown
    - type: tile
      entity: select.xbloom_studio_tea
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: tea
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unknown
    - type: tile
      entity: sensor.xbloom_studio_waiting_brews
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: numeric_state
        entity: sensor.xbloom_studio_waiting_brews
        above: 0
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## How was it?'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}**{{ e(states(''sensor.xbloom_studio_brew_to_rate'')) }}** with {{
        e(state_attr(''sensor.xbloom_studio_brew_to_rate'', ''bag'')) }}{% set cs = state_attr(''sensor.xbloom_studio_brew_to_rate'',
        ''changes'') or [] %}{% if cs %}, at {% for c in cs %}{% if c.setting == ''grind'' %}grind {{
        (c.value | float) | round(1) | string | replace(''.0'', '''') }} instead of {{ (c.saved | float)
        | round(1) | string | replace(''.0'', '''') }}{% elif c.setting == ''ratio'' %}ratio 1:{{ (c.value
        | float) | round(1) | string | replace(''.0'', '''') }} instead of 1:{{ (c.saved | float) | round(1)
        | string | replace(''.0'', '''') }}{% else %}{{ (c.value | float) | round(1) | string | replace(''.0'',
        '''') }} g instead of {{ (c.saved | float) | round(1) | string | replace(''.0'', '''') }} g{%
        endif %}{% if not loop.last %}, {% endif %}{% endfor %}{% endif %}.'
    - type: tile
      entity: select.xbloom_studio_verdict
      name: Verdict
      icon_tap_action:
        action: none
      features:
      - type: select-options
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_brew_to_rate
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_brew_to_rate
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## What was wrong'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}{{ e(state_attr(''select.xbloom_studio_what_was_wrong'', ''recipe''))
        }} with {{ e(state_attr(''select.xbloom_studio_what_was_wrong'', ''bag'')) }}'
    - type: tile
      entity: select.xbloom_studio_what_was_wrong
      name: What was wrong
      icon_tap_action:
        action: none
      features:
      - type: select-options
    visibility:
    - condition: state
      entity: select.xbloom_studio_what_was_wrong
      state_not: unavailable
    - condition: state
      entity: select.xbloom_studio_what_was_wrong
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Buy it again?'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}**{{ e(states(''sensor.xbloom_studio_finished_bag'')) }}** is finished.'
    - type: tile
      entity: select.xbloom_studio_buy_again
      name: Buy again
      icon_tap_action:
        action: none
      features:
      - type: select-options
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_finished_bag
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_finished_bag
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Save this change?'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}**{{ e(states(''sensor.xbloom_studio_version_to_keep'')) }}** {%
        for c in state_attr(''sensor.xbloom_studio_version_to_keep'', ''changes'') or [] %}{% if c.setting
        == ''grind'' %}grind {{ (c.value | float) | round(1) | string | replace(''.0'', '''') }}{% elif
        c.setting == ''ratio'' %}1:{{ (c.value | float) | round(1) | string | replace(''.0'', '''') }}{%
        else %}{{ (c.value | float) | round(1) | string | replace(''.0'', '''') }} g{% endif %}{% if not
        loop.last %}, {% endif %}{% endfor %} is worth brewing again.'
    - type: tile
      entity: button.xbloom_studio_make_version_the_recipe
      name: Update the saved recipe
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_make_version_the_recipe
        confirmation:
          text: Change the saved recipe to these settings?
    - type: tile
      entity: button.xbloom_studio_save_version_as_new_recipe
      name: Save as a new recipe
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_save_version_as_new_recipe
    - type: tile
      entity: button.xbloom_studio_leave_recipe_unchanged
      name: Leave the recipe as it is
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_leave_recipe_unchanged
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_version_to_keep
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_version_to_keep
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Brew in progress'
    - type: tile
      entity: sensor.xbloom_studio_current_recipe
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unknown
    - type: markdown
      text_only: true
      content: '{% set p = ''sensor.xbloom_studio_current_pour'' %}{% set total = state_attr(p, ''total_pours'')
        %}**Pour {{ states(p) }}{% if total %} of {{ total }}{% endif %}**'
      visibility:
      - condition: numeric_state
        entity: sensor.xbloom_studio_current_pour
        above: 0
    - type: markdown
      text_only: true
      content: '{% set s = states(''sensor.xbloom_studio_brew_time'') | int(0) %}**Brew time {{ s // 60
        }}:{{ ''%02d'' % (s % 60) }}**'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_brew_time
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_brew_time
        state_not: unknown
    - type: tile
      entity: button.xbloom_studio_pause_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_pause_brew
      visibility:
      - condition: state
        entity: binary_sensor.xbloom_studio_brew_paused
        state: 'off'
    - type: tile
      entity: button.xbloom_studio_resume_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_resume_brew
      visibility:
      - condition: state
        entity: binary_sensor.xbloom_studio_brew_paused
        state: 'on'
    - type: tile
      entity: button.xbloom_studio_cancel_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_cancel_brew
        confirmation:
          text: Stop the brew in progress?
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: grinding
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Current bag'
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - *id001
      - *id002
    - type: tile
      entity: select.xbloom_studio_xpod_box
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: xpod
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
    - type: markdown
      text_only: true
      content: '{% set n = state_attr(''select.xbloom_studio_xpod_box'', ''pods_left'') %}{% if n is not
        none %}Pods left: {{ n }}{% endif %}'
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: xpod
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unknown
    - type: tile
      entity: select.xbloom_studio_tea
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: tea
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unavailable
    - type: markdown
      content: '{% set a = states[''select.xbloom_studio_coffee_bag''].attributes if states[''select.xbloom_studio_coffee_bag'']
        else {} %}{{ [a.get(''roaster''), [a.get(''country''), a.get(''region'')] | select | join('',
        ''), a.get(''process''), a.get(''varietal''), a.get(''roast'')] | select | join('' · '') }}{%
        if a.get(''roaster_notes'') %}


        {{ a.get(''roaster_notes'') }}{% endif %}'
      visibility:
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unknown
      - *id001
      - *id002
    - type: tile
      entity: sensor.xbloom_studio_last_brew_counted
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_last_brew_counted
        state: flagged
    visibility:
    - condition: state
      entity: select.xbloom_studio_coffee_bag
      state_not: unavailable
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## A recipe for this bag'
    - type: tile
      entity: select.xbloom_studio_drink
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
    - type: tile
      entity: button.xbloom_studio_suggest_recipe
      name: Suggest a recipe
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_suggest_recipe
    - type: tile
      entity: select.xbloom_studio_suggested_recipe
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: state
        entity: select.xbloom_studio_suggested_recipe
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_suggested_recipe
        state_not: unknown
    - type: markdown
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}{% set source = state_attr(''select.xbloom_studio_suggested_recipe'',
        ''source'') %}{% set chosen = states(''select.xbloom_studio_suggested_recipe'') %}{% set own =
        (state_attr(''sensor.xbloom_studio_recipe_suggestions'', ''own'') or []) | selectattr(''name'',
        ''eq'', chosen) | list %}{% if source == ''own'' and own %}{% set o = own[0] %}Brewed {% if o.brews
        == 1 %}once{% elif o.brews == 2 %}twice{% else %}{{ o.brews }} times{% endif %} {% if o.matched
        == ''this_bag'' %}with this bag{% elif o.matched == ''origin_process'' %}with {{ e(state_attr(''select.xbloom_studio_coffee_bag'',
        ''country'')) }} {{ e(state_attr(''select.xbloom_studio_coffee_bag'', ''process'')) }} coffee{%
        else %}with coffee from {{ e(state_attr(''select.xbloom_studio_coffee_bag'', ''country'')) }}{%
        endif %}.{% if o.versions %}


        Versions with this bag: {% for v in o.versions %}{{ [((''grind '' ~ ((v.grind | float) | round(1)
        | string | replace(''.0'', '''')) ~ '''') if v.grind is not none else ''''), ((''1:'' ~ ((v.ratio
        | float) | round(1) | string | replace(''.0'', '''')) ~ '''') if v.ratio is not none else ''''),
        (('''' ~ ((v.dose_g | float) | round(1) | string | replace(''.0'', '''')) ~ '' g'') if v.dose_g
        is not none else '''')] | select | join('' · '') }} — {% if v.verdict == ''again'' %}Again{% elif
        v.verdict == ''fine'' %}Fine{% else %}Not again{% endif %}{% if not loop.last %}; {% endif %}{%
        endfor %}.{% endif %}{% elif source == ''community'' %}From the community, shared by {{ ''xBloom''
        if state_attr(''select.xbloom_studio_suggested_recipe'', ''official'') else e(state_attr(''select.xbloom_studio_suggested_recipe'',
        ''author'')) }}. Using it adds it to your recipes.{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_suggestions
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_recipe_suggestions
        state_not: unknown
    - type: tile
      entity: button.xbloom_studio_use_suggested_recipe
      name: Use this recipe
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_use_suggested_recipe
      visibility:
      - condition: state
        entity: select.xbloom_studio_suggested_recipe
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_suggested_recipe
        state_not: unknown
    visibility:
    - condition: state
      entity: select.xbloom_studio_coffee_bag
      state_not: unavailable
    - condition: state
      entity: select.xbloom_studio_coffee_bag
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Brew with the xBloom'
    - type: tile
      entity: select.xbloom_studio_recipe
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: select.xbloom_studio_coffee_bag
          state: unavailable
        - condition: and
          conditions:
          - condition: state
            entity: select.xbloom_studio_recipe
            state_not: unavailable
          - condition: state
            entity: select.xbloom_studio_recipe
            state_not: unknown
        - condition: and
          conditions:
          - condition: state
            entity: select.xbloom_studio_coffee_bag
            state_not: unavailable
          - condition: state
            entity: select.xbloom_studio_coffee_bag
            state_not: unknown
        - condition: and
          conditions:
          - condition: state
            entity: select.xbloom_studio_xpod_box
            state_not: unavailable
          - condition: state
            entity: select.xbloom_studio_xpod_box
            state_not: unknown
        - condition: and
          conditions:
          - condition: state
            entity: select.xbloom_studio_tea
            state_not: unavailable
          - condition: state
            entity: select.xbloom_studio_tea
            state_not: unknown
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}Last time you wanted: **{% set s = state_attr(''sensor.xbloom_studio_next_change'',
        ''settings'') or {} %}{% if s %}{% for k, v in s.items() %}{% if k == ''grind'' %}grind {{ (v
        | float) | round(1) | string | replace(''.0'', '''') }}{% elif k == ''ratio'' %}ratio 1:{{ (v
        | float) | round(1) | string | replace(''.0'', '''') }}{% else %}{{ (v | float) | round(1) | string
        | replace(''.0'', '''') }} g of coffee{% endif %}{% if not loop.last %}, {% endif %}{% endfor
        %}{% else %}{{ e(states(''sensor.xbloom_studio_next_change'')) }}{% endif %}**.'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_next_change
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_next_change
        state_not: unknown
    - type: tile
      entity: button.xbloom_studio_use_next_change
      name: Use that change
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_use_next_change
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_next_change
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_next_change
        state_not: unknown
    - type: markdown
      text_only: true
      content: '{% set r = state_attr(''binary_sensor.xbloom_studio_recipe_ready'', ''reason'') %}{% if
        state_attr(''binary_sensor.xbloom_studio_recipe_ready'', ''preparing'') %}Preparing the recipe.{%
        elif r is none %}The machine did not take the recipe. Pick it again.{% elif r == ''no_bag'' %}Pick
        a bag to prepare this recipe.{% elif r in [''machine_not_found'', ''machine_unreachable''] %}The
        machine is out of range.{% elif r == ''refused_not_on_home_screen'' %}Return the machine to its
        home screen to brew a recipe.{% elif r == ''refused_no_water'' %}Fill the water tank.{% else %}The
        machine did not take the recipe. Pick it again.{% endif %}'
      visibility:
      - condition: state
        entity: select.xbloom_studio_recipe
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_recipe
        state_not: unknown
      - condition: state
        entity: binary_sensor.xbloom_studio_recipe_ready
        state: 'off'
    - type: tile
      entity: button.xbloom_studio_start_brew
      name:
        type: entity
