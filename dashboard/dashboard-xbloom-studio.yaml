# Built by dashboard/build.py — edit that, not this file.
views:
- title: Brew
  path: brew
  icon: mdi:coffee
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Right now'
    - type: tile
      entity: sensor.xbloom_studio_brew_status
      name:
        type: entity
      icon_tap_action:
        action: none
    - type: tile
      entity: binary_sensor.xbloom_studio_in_range
      name: Machine
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_coffee_left
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unknown
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
    - type: tile
      entity: select.xbloom_studio_xpod_box
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: xpod
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unknown
    - type: tile
      entity: select.xbloom_studio_tea
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: tea
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unknown
    - type: markdown
      text_only: true
      content: '{% set m = state_attr(''sensor.xbloom_studio_coffee_stock'', ''measure'') %}{% set least
        = state_attr(''sensor.xbloom_studio_coffee_stock'', ''at_least'') %}{% set n = ((least if least
        is not none else states(''sensor.xbloom_studio_coffee_stock'')) | float(0) | round(0) | int) %}{%
        if n == 0 and least is none %}No coffee left.{% else %}Running low on coffee: {% if m == ''days''
        %}{% if least is not none %}at least {% if n == 1 %}1 day{% else %}{{ n }} days{% endif %}{% else
        %}about {% if n == 1 %}1 day{% else %}{{ n }} days{% endif %}{% endif %}{% elif m == ''grams''
        %}{% if least is not none %}at least {{ n }} g{% else %}{{ n }} g{% endif %}{% elif m == ''cups''
        %}{% if least is not none %}at least {% if n == 1 %}1 cup{% else %}{{ n }} cups{% endif %}{% else
        %}about {% if n == 1 %}1 cup{% else %}{{ n }} cups{% endif %}{% endif %}{% elif m == ''bags''
        %}{% if least is not none %}at least {% if n == 1 %}1 bag{% else %}{{ n }} bags{% endif %}{% else
        %}{% if n == 1 %}1 bag{% else %}{{ n }} bags{% endif %}{% endif %}{% endif %} left.{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
      - condition: state
        entity: binary_sensor.xbloom_studio_coffee_stock_low
        state: 'on'
    - type: markdown
      text_only: true
      content: '{% set m = state_attr(''sensor.xbloom_studio_tea_stock'', ''measure'') %}{% set least
        = state_attr(''sensor.xbloom_studio_tea_stock'', ''at_least'') %}{% set n = ((least if least is
        not none else states(''sensor.xbloom_studio_tea_stock'')) | float(0) | round(0) | int) %}{% if
        n == 0 and least is none %}No tea left.{% else %}Running low on tea: {% if m == ''days'' %}{%
        if least is not none %}at least {% if n == 1 %}1 day{% else %}{{ n }} days{% endif %}{% else %}about
        {% if n == 1 %}1 day{% else %}{{ n }} days{% endif %}{% endif %}{% elif m == ''grams'' %}{% if
        least is not none %}at least {{ n }} g{% else %}{{ n }} g{% endif %}{% elif m == ''cups'' %}{%
        if least is not none %}at least {% if n == 1 %}1 cup{% else %}{{ n }} cups{% endif %}{% else %}about
        {% if n == 1 %}1 cup{% else %}{{ n }} cups{% endif %}{% endif %}{% elif m == ''bags'' %}{% if
        least is not none %}at least {% if n == 1 %}1 pack{% else %}{{ n }} packs{% endif %}{% else %}{%
        if n == 1 %}1 pack{% else %}{{ n }} packs{% endif %}{% endif %}{% endif %} left.{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: tea
      - condition: state
        entity: binary_sensor.xbloom_studio_tea_stock_low
        state: 'on'
    - type: markdown
      text_only: true
      content: '{% set m = state_attr(''sensor.xbloom_studio_xpod_stock'', ''measure'') %}{% set least
        = state_attr(''sensor.xbloom_studio_xpod_stock'', ''at_least'') %}{% set n = ((least if least
        is not none else states(''sensor.xbloom_studio_xpod_stock'')) | float(0) | round(0) | int) %}{%
        if n == 0 and least is none %}No xPods left.{% else %}Running low on xPods: {% if m == ''days''
        %}{% if least is not none %}at least {% if n == 1 %}1 day{% else %}{{ n }} days{% endif %}{% else
        %}about {% if n == 1 %}1 day{% else %}{{ n }} days{% endif %}{% endif %}{% elif m == ''pods''
        %}{% if least is not none %}at least {% if n == 1 %}1 pod{% else %}{{ n }} pods{% endif %}{% else
        %}{% if n == 1 %}1 pod{% else %}{{ n }} pods{% endif %}{% endif %}{% elif m == ''boxes'' %}{%
        if least is not none %}at least {% if n == 1 %}1 box{% else %}{{ n }} boxes{% endif %}{% else
        %}{% if n == 1 %}1 box{% else %}{{ n }} boxes{% endif %}{% endif %}{% endif %} left.{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state: xpod
      - condition: state
        entity: binary_sensor.xbloom_studio_xpod_stock_low
        state: 'on'
    - type: tile
      entity: sensor.xbloom_studio_waiting_brews
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: numeric_state
        entity: sensor.xbloom_studio_waiting_brews
        above: 0
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## How was it?'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}**{{ e(states(''sensor.xbloom_studio_brew_to_rate'')) }}** with {{
        e(state_attr(''sensor.xbloom_studio_brew_to_rate'', ''bag'')) }}{% set cs = state_attr(''sensor.xbloom_studio_brew_to_rate'',
        ''changes'') or [] %}{% if cs %}, at {% for c in cs %}{% if c.setting == ''grind'' %}grind {{
        (c.value | float) | round(1) | string | replace(''.0'', '''') }} instead of {{ (c.saved | float)
        | round(1) | string | replace(''.0'', '''') }}{% elif c.setting == ''ratio'' %}ratio 1:{{ (c.value
        | float) | round(1) | string | replace(''.0'', '''') }} instead of 1:{{ (c.saved | float) | round(1)
        | string | replace(''.0'', '''') }}{% else %}{{ (c.value | float) | round(1) | string | replace(''.0'',
        '''') }} g instead of {{ (c.saved | float) | round(1) | string | replace(''.0'', '''') }} g{%
        endif %}{% if not loop.last %}, {% endif %}{% endfor %}{% endif %}.{% set f = state_attr(''sensor.xbloom_studio_brew_to_rate'',
        ''focus'') %}{% if f %}


        {{ e(f) }}{% endif %}'
    - type: tile
      entity: select.xbloom_studio_verdict
      name: Verdict
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_brew_to_rate
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_brew_to_rate
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## What was wrong'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}{{ e(state_attr(''select.xbloom_studio_what_was_wrong'', ''recipe''))
        }} with {{ e(state_attr(''select.xbloom_studio_what_was_wrong'', ''bag'')) }}'
    - type: tile
      entity: select.xbloom_studio_what_was_wrong
      name: Answer
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    visibility:
    - condition: state
      entity: select.xbloom_studio_what_was_wrong
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Buy it again?'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}**{{ e(states(''sensor.xbloom_studio_finished_bag'')) }}** is finished.'
    - type: tile
      entity: select.xbloom_studio_buy_again
      name: Answer
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_finished_bag
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_finished_bag
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Save this change?'
    - type: markdown
      text_only: true
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}**{{ e(states(''sensor.xbloom_studio_version_to_keep'')) }}** {%
        for c in state_attr(''sensor.xbloom_studio_version_to_keep'', ''changes'') or [] %}{% if c.setting
        == ''grind'' %}grind {{ (c.value | float) | round(1) | string | replace(''.0'', '''') }}{% elif
        c.setting == ''ratio'' %}1:{{ (c.value | float) | round(1) | string | replace(''.0'', '''') }}{%
        else %}{{ (c.value | float) | round(1) | string | replace(''.0'', '''') }} g{% endif %}{% if not
        loop.last %}, {% endif %}{% endfor %} is worth brewing again.'
    - type: tile
      entity: button.xbloom_studio_make_version_the_recipe
      name: Update the saved recipe
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_make_version_the_recipe
        confirmation:
          text: Change the saved recipe to these settings?
    - type: tile
      entity: button.xbloom_studio_save_version_as_new_recipe
      name: Save as a new recipe
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_save_version_as_new_recipe
    - type: tile
      entity: button.xbloom_studio_leave_recipe_unchanged
      name: Leave the recipe as it is
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_leave_recipe_unchanged
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_version_to_keep
      state_not: unavailable
    - condition: state
      entity: sensor.xbloom_studio_version_to_keep
      state_not: unknown
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Brew in progress'
    - type: tile
      entity: sensor.xbloom_studio_current_recipe
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unknown
    - type: markdown
      text_only: true
      content: '{% set p = ''sensor.xbloom_studio_current_pour'' %}{% set total = state_attr(p, ''total_pours'')
        %}{% set stage = states(''sensor.xbloom_studio_brew_stage'') %}{% if stage == ''waiting'' %}**Waiting
        after pour {{ states(p) }}**{% elif stage == ''draining'' %}**Draining**{% else %}**Pour {{ states(p)
        }}{% if total %} of {{ total }}{% endif %}**{% endif %}'
      visibility:
      - condition: numeric_state
        entity: sensor.xbloom_studio_current_pour
        above: 0
    - type: tile
      entity: sensor.xbloom_studio_next_pour
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_next_pour
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_next_pour
        state_not: unknown
    - type: markdown
      text_only: true
      show_empty: false
      content: '{% macro e(s) %}{{ (s or '''') | string | regex_replace(''([\\\\`*_{}\\[\\]()<>#+!|~])'',
        ''\\\\\\1'') }}{% endmacro %}{% set s = ''sensor.xbloom_studio_brew_story'' %}{% if state_attr(s,
        ''now'') %}{{ e(state_attr(s, ''now'')) }}{% endif %}{% if state_attr(s, ''story'') %}


        **{{ e(states(s)) }}**


        {{ e(state_attr(s, ''story'')) }}{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_brew_stage
        state:
        - pouring
        - waiting
        - draining
    - type: markdown
      text_only: true
      content: '{% set s = states(''sensor.xbloom_studio_brew_time'') | int(0) %}**Brew time {{ s // 60
        }}:{{ ''%02d'' % (s % 60) }}**'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_brew_time
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_brew_time
        state_not: unknown
    - type: markdown
      text_only: true
      content: '{% set n = states(''sensor.xbloom_studio_water_poured'') | int(0) %}{% set total = state_attr(''sensor.xbloom_studio_water_poured'',
        ''recipe_water_ml'') %}**Water poured:** {{ n }}{% if total %} of {{ total }}{% endif %} ml'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_water_poured
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_water_poured
        state_not: unknown
    - type: markdown
      text_only: true
      show_empty: false
      content: '{% set a = states[''sensor.xbloom_studio_machine_status''].attributes if states[''sensor.xbloom_studio_machine_status'']
        else {} %}{% set left = a.get(''water_left_ml'') %}{% if left is number %}{% set short = [a.get(''water_needed_ml'',
        0) - left, 0] | max %}**Water:** {% if left > 0 %}{{ left }} ml left{% else %}none left{% endif
        %}, {% if a.get(''water_enough_to_finish'') %}enough to finish{% else %}{{ short }} ml short{%
        endif %}{% endif %}'
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_machine_status
        state: no_water
    - type: tile
      entity: button.xbloom_studio_pause_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_pause_brew
      visibility:
      - condition: state
        entity: binary_sensor.xbloom_studio_brew_paused
        state: 'off'
    - type: tile
      entity: button.xbloom_studio_resume_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_resume_brew
      visibility:
      - condition: state
        entity: binary_sensor.xbloom_studio_brew_paused
        state: 'on'
    - type: tile
      entity: button.xbloom_studio_cancel_brew
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_cancel_brew
        confirmation:
          text: Stop the brew in progress?
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: grinding
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Current bag'
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
      hide_state: true
      tap_action:
        action: none
    - type: tile
      entity: select.xbloom_studio_xpod_box
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: xpod
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      hide_state: true
      tap_action:
        action: none
    - type: markdown
      text_only: true
      content: '{% set n = state_attr(''select.xbloom_studio_xpod_box'', ''pods_left'') %}{% if n is not
        none %}Pods left: {{ n }}{% endif %}'
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: xpod
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_xpod_box
        state_not: unknown
    - type: tile
      entity: select.xbloom_studio_tea
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: tea
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unknown
        - condition: state
          entity: sensor.xbloom_studio_recipe_kind
          state: unavailable
      - condition: state
        entity: select.xbloom_studio_tea
        state_not: unavailable
      hide_state: true
      tap_action:
        action: none
    - type: markdown
      content: '{% set a = states[''select.xbloom_studio_coffee_bag''].attributes if states[''select.xbloom_studio_coffee_bag'']
        else {} %}{{ [a.get(''roaster''), [a.get(''country''), a.get(''region'')] | select | join('',
        ''), a.get(''process''), a.get(''varietal''), a.get(''roast'')] | select | join('', '') }}{% if
        a.get(''roaster_notes'') %}


        {{ a.get(''roaster_notes'') }}{% endif %}'
      visibility:
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unknown
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: xpod
      - condition: state
        entity: sensor.xbloom_studio_recipe_kind
        state_not: tea
    - type: tile
      entity: sensor.xbloom_studio_last_brew_counted
      name:
        type: entity
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_last_brew_counted
        state: flagged
    - type: tile
      entity: button.xbloom_studio_refresh_coffee_bags
      name:
        type: entity
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_coffee_bags
      visibility:
      - condition: state
        entity: button.xbloom_studio_refresh_coffee_bags
        state_not: unavailable
    visibility:
    - condition: state
      entity: select.xbloom_studio_coffee_bag
      state_not: unavailable
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## A recipe for this bag'
    - type: tile
      entity: select.xbloom_studio_drink
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      hide_state: true
      tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_suggest_recipe
      name: Suggest a recipe
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_suggest_recipe
    - type: tile
      entity: select.xbloom_studio_suggested_recipe
      name:
        type: entity
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: state
        entity: select.xbloom_studio_suggested_recipe
        state_not: unavailable
      - condition: state
