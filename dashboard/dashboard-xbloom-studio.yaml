# Built by dashboard/build.py — edit that, not this file.
views:
- title: Brew
  path: brew
  icon: mdi:coffee
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Right now'
    - type: tile
      entity: sensor.xbloom_studio_brew_status
      icon_tap_action:
        action: none
    - type: tile
      entity: binary_sensor.xbloom_studio_in_range
      icon_tap_action:
        action: none
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unknown
    - type: tile
      entity: sensor.xbloom_studio_coffee_left
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_coffee_left
        state_not: unknown
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Brew in progress'
    - type: tile
      entity: sensor.xbloom_studio_current_recipe
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unknown
    - type: tile
      entity: sensor.xbloom_studio_current_pour
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_pause_brew
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_pause_brew
    - type: tile
      entity: button.xbloom_studio_resume_brew
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_resume_brew
    - type: tile
      entity: button.xbloom_studio_cancel_brew
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_cancel_brew
        confirmation:
          text: Stop the brew in progress?
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: grinding
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Current bag'
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      icon_tap_action:
        action: none
      features:
      - type: select-options
    - type: markdown
      content: '{% set a = states[''select.xbloom_studio_coffee_bag''].attributes if states[''select.xbloom_studio_coffee_bag'']
        else {} %}{{ [a.get(''roaster''), [a.get(''country''), a.get(''region'')] | select | join('',
        ''), a.get(''process'')] | select | join('' · '') }}{% if a.get(''roaster_notes'') %}


        {{ a.get(''roaster_notes'') }}{% endif %}'
      visibility:
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unavailable
      - condition: state
        entity: select.xbloom_studio_coffee_bag
        state_not: unknown
    - type: tile
      entity: sensor.xbloom_studio_last_brew_counted
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_last_brew_counted
        state: flagged
    visibility:
    - condition: state
      entity: select.xbloom_studio_coffee_bag
      state_not: unavailable
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Brew with the xBloom'
    - type: tile
      entity: select.xbloom_studio_recipe
      icon_tap_action:
        action: none
      features:
      - type: select-options
    - type: tile
      entity: button.xbloom_studio_start_brew
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_start_brew
      grid_options:
        columns: 6
    - type: tile
      entity: button.xbloom_studio_refresh_recipes
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_recipes
      grid_options:
        columns: 6
    - type: tile
      entity: button.xbloom_studio_refresh_coffee_bags
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_coffee_bags
      visibility:
      - condition: state
        entity: button.xbloom_studio_refresh_coffee_bags
        state_not: unavailable
    - type: tile
      entity: input_boolean.xbloom_show_advanced
      icon_tap_action:
        action: none
      tap_action:
        action: toggle
      name: Show brew adjustments
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Brew with the xBloom'
    - type: markdown
      text_only: true
      content: Return the machine to its home screen to brew a recipe.
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: sensor.xbloom_studio_current_module
        state: grinder
      - condition: state
        entity: sensor.xbloom_studio_current_module
        state: brewer
      - condition: state
        entity: sensor.xbloom_studio_current_module
        state: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Adjust this brew'
    - type: tile
      entity: switch.xbloom_studio_use_grinder
      icon_tap_action:
        action: none
      tap_action:
        action: toggle
    - type: tile
      entity: number.xbloom_studio_brew_grind_size
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
      visibility:
      - condition: state
        entity: switch.xbloom_studio_use_grinder
        state: 'on'
    - type: tile
      entity: number.xbloom_studio_brew_ratio
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
    - type: tile
      entity: number.xbloom_studio_brew_dose
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
      visibility:
      - condition: state
        entity: number.xbloom_studio_brew_dose
        state_not: unavailable
      - condition: state
        entity: number.xbloom_studio_brew_dose
        state_not: unknown
    - type: markdown
      content: '{% set rdose = state_attr(''select.xbloom_studio_recipe'',''dose_g'') | float(0) %}

        {% set dose = states(''number.xbloom_studio_brew_dose'') | float(rdose) %}

        {% set ratio = states(''number.xbloom_studio_brew_ratio'') | float(0) %}

        {% set water = dose * ratio %}

        {% set wu = states(''select.xbloom_studio_weight_unit'') %}

        ### This brew

        {% if wu == ''oz'' %}- **Coffee:** {{ (dose * 0.035274) | round(2) }} oz

        - **Water:** {{ (water * 0.033814) | round(1) }} oz

        {% else %}- **Coffee:** {{ dose | round(1) }} g

        - **Water:** {{ water | round(0) | int }} ml

        {% endif %}- **Ratio:** 1:{{ ratio | round(1) }}'
    - type: tile
      entity: input_boolean.xbloom_show_per_pour
      icon_tap_action:
        action: none
      tap_action:
        action: toggle
      name: Show each pour
    - type: markdown
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_per_pour
        state: 'on'
      content: '{% set pours = state_attr(''select.xbloom_studio_recipe'',''pours'') or [] %}

        {% set rdose = state_attr(''select.xbloom_studio_recipe'',''dose_g'') | float(0) %}

        {% set dose = states(''number.xbloom_studio_brew_dose'') | float(rdose) %}

        {% set ratio = states(''number.xbloom_studio_brew_ratio'') | float(0) %}

        {% set ns = namespace(orig=0) %}

        {% for p in pours %}{% set ns.orig = ns.orig + (p.volume_ml | float(0)) %}{% endfor %}

        {% set factor = (dose * ratio / ns.orig) if ns.orig > 0 else 0 %}

        {% set tu = states(''select.xbloom_studio_temperature_unit'') %}

        {% set wu = states(''select.xbloom_studio_weight_unit'') %}

        {% if pours %}| Pour | Water | Temp |

        |:--:|:--:|:--:|

        {% for p in pours %}| {{ loop.index }} | {% set v = (p.volume_ml | float(0)) * factor %}{% if
        wu == ''oz'' %}{{ (v * 0.033814) | round(2) }} oz{% else %}{{ v | round(0) | int }} ml{% endif
        %} | {% set c = p.temperature_c | float(0) %}{% if tu == ''f'' %}{{ (c * 9 / 5 + 32) | round(0)
        | int }}°F{% else %}{{ c | round(0) | int }}°C{% endif %} |

        {% endfor %}{% else %}_Pick a recipe to see its pours._{% endif %}'
    visibility:
    - condition: state
      entity: input_boolean.xbloom_show_advanced
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Save as a new recipe'
    - type: tile
      entity: text.xbloom_studio_new_recipe_name
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_save_as_new_recipe
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_save_as_new_recipe
    visibility:
    - condition: state
      entity: input_boolean.xbloom_show_advanced
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Manual brew'
    - type: tile
      entity: input_boolean.xbloom_show_manual_brew
      icon_tap_action:
        action: none
      tap_action:
        action: toggle
      name: Show manual brew
    - type: tile
      entity: select.xbloom_studio_manual_brewer
      icon_tap_action:
        action: none
      features:
      - type: select-options
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_manual_brew
        state: 'on'
      grid_options:
        columns: 6
    - type: tile
      entity: number.xbloom_studio_manual_brew_dose
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_manual_brew
        state: 'on'
      grid_options:
        columns: 6
    - type: tile
      entity: button.xbloom_studio_record_manual_brew
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_record_manual_brew
        confirmation:
          text: Record this manual brew?
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_manual_brew
        state: 'on'
    - type: tile
      entity: sensor.xbloom_studio_last_brew_counted
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_manual_brew
        state: 'on'
      - condition: state
        entity: sensor.xbloom_studio_last_brew_counted
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_last_brew_counted
        state_not: unknown
    visibility:
    - condition: state
      entity: select.xbloom_studio_manual_brewer
      state_not: unavailable
- title: Stats
  path: stats
  icon: mdi:chart-bar
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Coffee stats'
    - type: tile
      entity: select.xbloom_studio_stats_period
      icon_tap_action:
        action: none
      features:
      - type: select-options
    - type: tile
      entity: sensor.xbloom_studio_brews
      icon_tap_action:
        action: none
    - type: markdown
      content: '{% set a = states[''sensor.xbloom_studio_brews''].attributes if states[''sensor.xbloom_studio_brews'']
        else {} %}- **Coffee used:** {{ a.get(''coffee_g'', 0) | round(0) | int }} g

        {% if a.get(''water_ml'') %}- **Water brewed:** {{ a.get(''water_ml'') | round(0) | int }} ml

        {% endif %}- **Brews in the period before:** {{ (a.get(''previous_period'') or {}).get(''brews'',
        0) }}'
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_brews
      state_not: unavailable
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## By brewer'
    - type: markdown
      content: '{% for name, n in (state_attr(''sensor.xbloom_studio_brews'',''by_brewer'') or {}).items()
        %}- **{{ ''Other'' if name == ''other'' else name }}**: {{ n }}

        {% endfor %}'
    visibility:
    - condition: numeric_state
      entity: sensor.xbloom_studio_brews
      above: 0
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Brew history'
    - type: statistics-graph
      title: Brews per day
      chart_type: bar
      period: day
      days_to_show: 30
      stat_types:
      - change
      entities:
      - entity: xbloom:brews_xbloom
        name: xBloom
      - entity: xbloom:brews_manual
        name: Manual
    - type: statistics-graph
      title: Brews per month
      chart_type: bar
      period: month
      days_to_show: 365
      stat_types:
      - change
      entities:
      - entity: xbloom:brews_xbloom
        name: xBloom
      - entity: xbloom:brews_manual
        name: Manual
    - type: statistics-graph
      title: Coffee used per week
      chart_type: bar
      period: week
      days_to_show: 90
      stat_types:
      - change
      entities:
      - entity: xbloom:coffee_used
        name: Coffee used
    - type: statistics-graph
      title: Water brewed per week
      chart_type: bar
      period: week
      days_to_show: 90
      stat_types:
      - change
      entities:
      - entity: xbloom:water_brewed
        name: Water brewed
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_brews
      state_not: unavailable
- title: Bags
  path: bags
  icon: mdi:shopping
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Bags on hand'
    - type: markdown
      content: '{% set current = state_attr(''select.xbloom_studio_coffee_bag'',''id'') %}{% for b in
        state_attr(''sensor.xbloom_studio_coffee_bags'',''bags'') or [] %}- **{{ b.name }}**{{ '' (in
        use)'' if b.id == current }} — {{ ''unopened'' if b.status == ''unopened'' else ''open'' }}, {{
        (b.remaining_g | round(0) | int ~ '' g left'') if b.remaining_g is not none else ''not tracked''
        }}

        {% else %}No open or unopened bags.{% endfor %}'
    - type: tile
      entity: select.xbloom_studio_coffee_bag
      icon_tap_action:
        action: none
      features:
      - type: select-options
    - type: tile
      entity: button.xbloom_studio_refresh_coffee_bags
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_coffee_bags
      visibility:
      - condition: state
        entity: button.xbloom_studio_refresh_coffee_bags
        state_not: unavailable
    - type: markdown
      text_only: true
      content: '[Add or edit bags](/config/integrations/integration/xbloom)'
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_coffee_bags
      state_not: unavailable
- title: xBloom
  path: xbloom
  icon: mdi:coffee-maker
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Connection & status'
    - type: tile
      entity: switch.xbloom_studio_connect
      icon_tap_action:
        action: none
      tap_action:
        action: toggle
    - type: tile
      entity: button.xbloom_studio_refresh_status
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_status
    - type: tile
      entity: sensor.xbloom_studio_status_updated
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_brew_status
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_machine_status
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_current_module
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_current_module
        state_not: unavailable
      - condition: state
        entity: sensor.xbloom_studio_current_module
        state_not: unknown
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Modules'
    - type: tile
      entity: button.xbloom_studio_go_to_grinder
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_go_to_grinder
    - type: tile
      entity: button.xbloom_studio_go_to_brewer
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_go_to_brewer
    - type: tile
      entity: button.xbloom_studio_go_to_scale
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_go_to_scale
    visibility:
    - &id001
      condition: state
      entity: switch.xbloom_studio_connect
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Grinder'
    - &id002
      type: tile
      entity: button.xbloom_studio_back_to_home
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_back_to_home
    - type: tile
      entity: number.xbloom_studio_grind_size
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
    - type: tile
      entity: number.xbloom_studio_grind_speed
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
    - type: tile
      entity: button.xbloom_studio_grind
      icon_tap_action:
        action: none
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_grind
    visibility:
    - *id001
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state: grinder
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Brewer'
    - *id002
    - type: tile
      entity: number.xbloom_studio_brew_temperature
      icon_tap_action:
        action: none
      features:
      - type: numeric-input
        style: slider
    - type: tile
      entity: select.xbloom_studio_brew_pattern
      icon_tap_action:
        action: none
      features:
      - type: select-options
    - type: tile
      entity: number.xbloom_studio_brew_volume
      icon_tap_action:
        action: none
