        = all | rejectattr(''status'', ''eq'', ''unopened'') | list %}{% set in_use = opened | selectattr(''id'',
        ''in'', current) | list %}{% set rest = opened | rejectattr(''id'', ''in'', current) | list %}{%
        set counted = rest | selectattr(''remaining_g'', ''defined'') | rejectattr(''remaining_g'', ''none'')
        | sort(attribute=''remaining_g'') | list %}{% set ordered = in_use + counted + (rest | reject(''in'',
        counted) | list) %}{% if ordered %}## Open bags


