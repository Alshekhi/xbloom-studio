        = state_attr(''select.xbloom_studio_community_recipe'', ''shown'') | int(0) %}{% if n == 0 %}No
        recipes match.{% elif n == 1 %}1 recipe matches.{% else %}{{ n }} recipes match.{% endif %}{%
        if 0 < shown < n %} The first {{ shown }} are in the list below.{% endif %}'
      visibility:
      - condition: state
