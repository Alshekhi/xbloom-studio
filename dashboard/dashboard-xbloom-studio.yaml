views:
- title: Studio
  path: studio
  icon: mdi:coffee-maker
  type: sections
  max_columns: 2
  sections:
  - type: grid
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
    cards:
    - type: markdown
      text_only: true
      content: '## Connection & status'
    - type: markdown
      text_only: true
      content: '**Connect** holds the Bluetooth link so the machine streams live readings and the Grinder
        / Brewer / Scale controls appear. **Refresh status** grabs a one-off snapshot without holding
        the link. Turn Connect off to hand the machine back to the xBloom app.'
    - type: tile
      entity: switch.xbloom_studio_connect
      name: Connect (live session)
      tap_action:
        action: toggle
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_refresh_status
      name: Refresh status now
      icon: mdi:cloud-sync
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_status
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_status_updated
      name: Status updated
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_brew_status
      name: Brew status
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_machine_status
      name: Machine status
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_current_module
      name: You are here (machine screen)
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_current_module
        state_not: unknown
      - condition: state
        entity: sensor.xbloom_studio_current_module
        state_not: unavailable
  - type: grid
    visibility:
    - condition: state
      entity: switch.xbloom_studio_connect
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
    cards:
    - type: markdown
      text_only: true
      content: '## Modules'
    - type: markdown
      text_only: true
      content: Go to a module to drive it live; its controls replace this screen. Pressing a knob on the
        machine does the same.
    - type: tile
      entity: button.xbloom_studio_go_to_grinder
      name: Go to Grinder
      icon: mdi:grain
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_go_to_grinder
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_go_to_brewer
      name: Go to Brewer
      icon: mdi:cup-water
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_go_to_brewer
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_go_to_scale
      name: Go to Scale
      icon: mdi:scale-balance
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_go_to_scale
      icon_tap_action:
        action: none
  - type: grid
    visibility:
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
    cards:
    - type: markdown
      text_only: true
      content: '## Recipe (Auto brew)'
    - type: tile
      entity: select.xbloom_studio_recipe
      name: Pick a recipe
      features:
      - type: select-options
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_start_brew
      name: Start brew
      icon: mdi:play-circle
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_start_brew
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_refresh_recipes
      name: Refresh recipe list
      icon: mdi:refresh
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_refresh_recipes
      icon_tap_action:
        action: none
    - type: tile
      entity: input_boolean.xbloom_show_advanced
      name: Show advanced brew options
      tap_action:
        action: toggle
      icon_tap_action:
        action: none
  - type: grid
    visibility:
    - condition: state
      entity: input_boolean.xbloom_show_advanced
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
    cards:
    - type: markdown
      text_only: true
      content: '## Adjust this brew

        Change grind, ratio, or dose for a one-off brew — the saved recipe stays as it is. These reset
        whenever you pick a recipe.'
    - type: tile
      entity: switch.xbloom_studio_use_grinder
      name: Use grinder for this brew
      tap_action:
        action: toggle
      icon_tap_action:
        action: none
    - type: tile
      entity: number.xbloom_studio_brew_grind_size
      name: Grind size (lower is finer)
      features:
      - type: numeric-input
        style: slider
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: switch.xbloom_studio_use_grinder
        state: 'on'
    - type: tile
      entity: number.xbloom_studio_brew_ratio
      name: Ratio (1:N water)
      features:
      - type: numeric-input
        style: slider
      icon_tap_action:
        action: none
    - type: tile
      entity: number.xbloom_studio_brew_dose
      name: Dose (coffee)
      features:
      - type: numeric-input
        style: slider
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: number.xbloom_studio_brew_dose
        state_not: unavailable
      - condition: state
        entity: number.xbloom_studio_brew_dose
        state_not: unknown
    - type: markdown
      content: '{% set rdose = state_attr(''select.xbloom_studio_recipe'',''dose_g'') | float(0) %}

        {% set dose = states(''number.xbloom_studio_brew_dose'') | float(rdose) %}

        {% set ratio = states(''number.xbloom_studio_brew_ratio'') | float(0) %}

        {% set water = dose * ratio %}

        {% set wu = states(''select.xbloom_studio_weight_unit'') %}

        ### This brew

        {% if wu == ''oz'' %}- **Coffee:** {{ (dose * 0.035274) | round(2) }} oz

        - **Water:** {{ (water * 0.033814) | round(1) }} oz

        {% else %}- **Coffee:** {{ dose | round(1) }} g

        - **Water:** {{ water | round(0) | int }} ml

        {% endif %}- **Ratio:** 1:{{ ratio | round(1) }}'
    - type: tile
      entity: input_boolean.xbloom_show_per_pour
      name: Show each pour
      tap_action:
        action: toggle
      icon_tap_action:
        action: none
    - type: markdown
      visibility:
      - condition: state
        entity: input_boolean.xbloom_show_per_pour
        state: 'on'
      content: '{% set pours = state_attr(''select.xbloom_studio_recipe'',''pours'') or [] %}

        {% set rdose = state_attr(''select.xbloom_studio_recipe'',''dose_g'') | float(0) %}

        {% set dose = states(''number.xbloom_studio_brew_dose'') | float(rdose) %}

        {% set ratio = states(''number.xbloom_studio_brew_ratio'') | float(0) %}

        {% set ns = namespace(orig=0) %}

        {% for p in pours %}{% set ns.orig = ns.orig + (p.volume_ml | float(0)) %}{% endfor %}

        {% set factor = (dose * ratio / ns.orig) if ns.orig > 0 else 0 %}

        {% set tu = states(''select.xbloom_studio_temperature_unit'') %}

        {% set wu = states(''select.xbloom_studio_weight_unit'') %}

        {% if pours %}| Pour | Water | Temp |

        |:--:|:--:|:--:|

        {% for p in pours %}| {{ loop.index }} | {% set v = (p.volume_ml | float(0)) * factor %}{% if
        wu == ''oz'' %}{{ (v * 0.033814) | round(2) }} oz{% else %}{{ v | round(0) | int }} ml{% endif
        %} | {% set c = p.temperature_c | float(0) %}{% if tu == ''F'' %}{{ (c * 9 / 5 + 32) | round(0)
        | int }}°F{% else %}{{ c | round(0) | int }}°C{% endif %} |

        {% endfor %}{% else %}_Pick a recipe to see its pours._{% endif %}'
  - type: grid
    visibility:
    - condition: state
      entity: input_boolean.xbloom_show_advanced
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
    cards:
    - type: markdown
      text_only: true
      content: '## Save as a new recipe

        Saves the adjusted values as a new recipe (kept on this machine; also synced to your xBloom cloud
        if you''ve signed in). The original recipe is untouched.'
    - type: tile
      entity: text.xbloom_studio_new_recipe_name
      name: New recipe name
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_save_as_new_recipe
      name: Save as new recipe
      icon: mdi:content-save-plus
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_save_as_new_recipe
      icon_tap_action:
        action: none
  - type: grid
    visibility:
    - condition: state
      entity: input_boolean.xbloom_show_advanced
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: grinder
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: brewer
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state_not: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
    cards:
    - type: markdown
      text_only: true
      content: '## Recipe library'
    - type: tile
      entity: script.xbloom_delete_selected_recipe
      name: Delete selected recipe
      icon: mdi:delete-alert
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: script.xbloom_delete_selected_recipe
        confirmation:
          text: Delete the selected xBloom recipe from the library? This cannot be undone.
      icon_tap_action:
        action: none
    - type: markdown
      text_only: true
      content: '[Add or edit recipes](/config/integrations/integration/xbloom) — opens the xBloom integration
        page; press Configure for the recipe wizard.'
  - type: grid
    visibility:
    - condition: state
      entity: switch.xbloom_studio_connect
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state: grinder
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
    cards:
    - type: markdown
      text_only: true
      content: '## Grinder'
    - type: tile
      entity: button.xbloom_studio_back_to_home
      name: Back to home
      icon: mdi:arrow-left
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_back_to_home
      icon_tap_action:
        action: none
    - type: markdown
      text_only: true
      content: These mirror and set the machine's grinder knobs live.
    - type: tile
      entity: number.xbloom_studio_grind_size
      name: Grind size (lower is finer)
      features:
      - type: numeric-input
        style: slider
      icon_tap_action:
        action: none
    - type: tile
      entity: number.xbloom_studio_grind_speed
      name: Grind speed (RPM)
      features:
      - type: numeric-input
        style: slider
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_grind
      name: Grind now
      icon: mdi:play-circle
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_grind
      icon_tap_action:
        action: none
  - type: grid
    visibility:
    - condition: state
      entity: switch.xbloom_studio_connect
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state: brewer
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
    cards:
    - type: markdown
      text_only: true
      content: '## Brewer'
    - type: tile
      entity: button.xbloom_studio_back_to_home
      name: Back to home
      icon: mdi:arrow-left
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_back_to_home
      icon_tap_action:
        action: none
    - type: markdown
      text_only: true
      content: Temperature 39 = room temperature (RT), 96 = boiling point (BP); 40–95 are °C. Temperature
        and Pour pattern mirror the machine's brewer knobs.
    - type: tile
      entity: number.xbloom_studio_brew_temperature
      name: Temperature
      features:
      - type: numeric-input
        style: slider
      icon_tap_action:
        action: none
    - type: tile
      entity: select.xbloom_studio_brew_pattern
      name: Pour pattern
      features:
      - type: select-options
      icon_tap_action:
        action: none
    - type: tile
      entity: number.xbloom_studio_brew_volume
      name: Volume
      features:
      - type: numeric-input
        style: slider
      icon_tap_action:
        action: none
    - type: tile
      entity: number.xbloom_studio_brew_flow_rate
      name: Flow rate
      features:
      - type: numeric-input
        style: slider
      icon_tap_action:
        action: none
    - type: tile
      entity: select.xbloom_studio_water_source
      name: Water source
      features:
      - type: select-options
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_brew_standalone
      name: Brew (standalone)
      icon: mdi:play-circle
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_brew_standalone
      icon_tap_action:
        action: none
  - type: grid
    visibility:
    - condition: state
      entity: switch.xbloom_studio_connect
      state: 'on'
    - condition: state
      entity: sensor.xbloom_studio_current_module
      state: scale
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: grinding
    - condition: state
      entity: sensor.xbloom_studio_brew_status
      state_not: brewing
    cards:
    - type: markdown
      text_only: true
      content: '## Scale'
    - type: tile
      entity: button.xbloom_studio_back_to_home
      name: Back to home
      icon: mdi:arrow-left
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_back_to_home
      icon_tap_action:
        action: none
    - type: tile
      entity: sensor.xbloom_studio_scale_weight
      name: Scale weight
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_scale_weight
        state_not: unknown
      - condition: state
        entity: sensor.xbloom_studio_scale_weight
        state_not: unavailable
    - type: tile
      entity: button.xbloom_studio_tare_scale
      name: Tare scale
      icon: mdi:scale-balance
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_tare_scale
      icon_tap_action:
        action: none
  - type: grid
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: grinding
      - condition: state
        entity: sensor.xbloom_studio_brew_status
        state: brewing
    cards:
    - type: markdown
      text_only: true
      content: '## Brew in progress'
    - type: tile
      entity: sensor.xbloom_studio_current_recipe
      name: Recipe brewing now
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unknown
      - condition: state
        entity: sensor.xbloom_studio_current_recipe
        state_not: unavailable
    - type: tile
      entity: sensor.xbloom_studio_current_pour
      name: Current pour
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_pause_brew
      name: Pause brew
      icon: mdi:pause-circle
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_pause_brew
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_resume_brew
      name: Resume brew
      icon: mdi:play-pause
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_resume_brew
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_cancel_brew
      name: Stop brew
      icon: mdi:stop-circle
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_cancel_brew
        confirmation:
          text: Stop the brew in progress?
      icon_tap_action:
        action: none
- title: Machine
  path: machine
  icon: mdi:cog
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Settings'
    - type: tile
      entity: select.xbloom_studio_mode
      name: Mode
      features:
      - type: select-options
      icon_tap_action:
        action: none
    - type: tile
      entity: select.xbloom_studio_temperature_unit
      name: Temperature unit
      features:
      - type: select-options
      icon_tap_action:
        action: none
    - type: tile
      entity: select.xbloom_studio_weight_unit
      name: Weight unit
      features:
      - type: select-options
      icon_tap_action:
        action: none
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Connection tools'
    - type: tile
      entity: switch.xbloom_studio_connect
      name: Connect (live session)
      tap_action:
        action: toggle
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_ble_connect
      name: Test Bluetooth link
      icon: mdi:bluetooth-connect
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_ble_connect
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_ble_disconnect
      name: Force disconnect
      icon: mdi:bluetooth-off
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_ble_disconnect
      icon_tap_action:
        action: none
    - type: tile
      entity: button.xbloom_studio_back_to_home
      name: Send machine to home screen
      icon: mdi:home
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.xbloom_studio_back_to_home
      icon_tap_action:
        action: none
  - type: grid
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: automation.xbloom_brew_announcements
        state_not: unavailable
      - condition: state
        entity: automation.xbloom_machine_fault_announcements
        state_not: unavailable
      - condition: state
        entity: automation.xbloom_live_control_announcements
        state_not: unavailable
    cards:
    - type: markdown
      text_only: true
      content: '## Voice announcements


        Spoken however you set the blueprint up. Turn one off to silence it.'
    - type: tile
      entity: automation.xbloom_brew_announcements
      name: Speak brew progress
      tap_action:
        action: toggle
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: automation.xbloom_brew_announcements
        state_not: unavailable
    - type: tile
      entity: automation.xbloom_machine_fault_announcements
      name: Speak machine faults
      tap_action:
        action: toggle
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: automation.xbloom_machine_fault_announcements
        state_not: unavailable
    - type: tile
      entity: automation.xbloom_live_control_announcements
      name: Speak live readings
      tap_action:
        action: toggle
      icon_tap_action:
        action: none
      visibility:
      - condition: state
        entity: automation.xbloom_live_control_announcements
        state_not: unavailable
  - type: grid
    cards:
    - type: markdown
      text_only: true
      content: '## Updates'
    - type: tile
      entity: update.xbloom_studio_update
      name: Integration update
      features:
      - type: update-actions
      icon_tap_action:
        action: none
      visibility:
