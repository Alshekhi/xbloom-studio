        or {} %}{% if h %}{% set u = h.get(''usual'') or {} %}{% set v = h.get(''verdicts'') or {} %}##
        Summary


        - **Days brewed:** {{ h.get(''days_brewed'', 0) }} of {{ h.get(''days_in_period'', 0) }}

        {% if h.get(''longest_streak_days'', 0) > 1 %}- **Most days in a row:** {{ h.longest_streak_days
        }}

        {% endif %}{% if h.get(''cups_per_brewing_day'') %}- **Cups on a brewing day:** {{ ((h.cups_per_brewing_day
        | float) | round(1) | string | replace(''.0'', '''')) }}

        {% endif %}{% if u.get(''hot'') %}- **Usual hot cup:** {{ ((u[''hot''].dose_g | float) | round(1)
        | string | replace(''.0'', '''')) }} g at 1:{{ ((u[''hot''].ratio | float) | round(1) | string
        | replace(''.0'', '''')) }}

        {% endif %}{% if u.get(''iced'') %}- **Usual iced cup:** {{ ((u[''iced''].dose_g | float) | round(1)
        | string | replace(''.0'', '''')) }} g at 1:{{ ((u[''iced''].ratio | float) | round(1) | string
        | replace(''.0'', '''')) }}

        {% endif %}{% if h.get(''top_coffee'') %}- **Most brewed coffee:** ⁨{{ e(h.top_coffee.name) }}⁩
        ({{ h.top_coffee.brews }})

        {% endif %}{% if h.get(''top_recipe'') %}- **Most brewed recipe:** ⁨{{ e(h.top_recipe.name) }}⁩
        ({{ h.top_recipe.brews }})

        {% endif %}{% if h.get(''time_of_day'') %}- **Usually brewed:** {% if h.time_of_day == ''morning''
        %}in the morning{% elif h.time_of_day == ''afternoon'' %}in the afternoon{% elif h.time_of_day
        == ''evening'' %}in the evening{% elif h.time_of_day == ''night'' %}at night{% endif %}

        {% endif %}{% if v %}- **Verdicts:** {{ [("Keep it like this" ~ '' ('' ~ v.get(''again'') ~ '')'')
        if v.get(''again'') else '''', ("Close, needs a tweak" ~ '' ('' ~ v.get(''fine'') ~ '')'') if
        v.get(''fine'') else '''', ("Doesn''t suit this coffee" ~ '' ('' ~ v.get(''not_again'') ~ '')'')
        if v.get(''not_again'') else ''''] | select | join('', '') }}

        {% endif %}{% if h.get(''bags_opened'') %}- **Bags opened:** {% for b in h.bags_opened %}⁨{{ e(b)
        }}⁩{% if not loop.last %}, {% endif %}{% endfor %}{% endif %}{% endif %}'
