      content: '{% set pours = state_attr(''select.xbloom_studio_recipe'',''pours'') or [] %}

        {% set rdose = state_attr(''select.xbloom_studio_recipe'',''dose_g'') | float(0) %}

        {% set dose = states(''number.xbloom_studio_brew_dose'') | float(rdose) %}

        {% set ratio = states(''number.xbloom_studio_brew_ratio'') | float(0) %}

        {% set ns = namespace(orig=0) %}

        {% for p in pours %}{% set ns.orig = ns.orig + (p.volume_ml | float(0)) %}{% endfor %}

        {% set factor = (dose * ratio / ns.orig) if ns.orig > 0 else 0 %}

        {% set tu = states(''select.xbloom_studio_temperature_unit'') %}

        {% set wu = states(''select.xbloom_studio_weight_unit'') %}

