blueprint:
  name: "xBloom — Machine fault announcements"
  description: >
    Speaks the machine's faults as they happen, in English or Arabic: the tank
    empty, the grinder empty, the water and coffee amounts not matching, or
    the grinder out of position.
  domain: automation
  author: xbloom-studio-controler
  source_url: https://github.com/Alshekhi/xbloom-studio/blob/main/blueprints/automation/xbloom/machine_fault_announce.yaml
  homeassistant:
    min_version: 2024.6.0
  input:
    delivery:
      name: How to announce
      icon: mdi:bullhorn
      input:
        delivery_method:
          name: Announce with
          description: >
            Alexa uses the Alexa Media Player integration. Speaker (TTS) speaks
            through a TTS engine. Notification sends the text to a notify
            service, such as a phone. Fill in only the fields for the one you
            choose.
          default: alexa
          selector:
            select:
              options:
                - { value: alexa, label: Alexa }
                - { value: tts, label: Speaker (TTS) }
                - { value: notify, label: Notification }
        speakers:
          name: Speakers
          description: Where the faults are spoken.
          default: []
          selector:
            entity:
              domain: media_player
              multiple: true
        tts_engine:
          name: TTS engine
          description: For Speaker (TTS) only, for example tts.piper.
          default: ""
          selector:
            entity:
              domain: tts
        notify_service:
          name: Notify service
          description: >
            For Notification only, for example notify.mobile_app_my_phone.
          default: ""
          selector:
            text:
    content:
      name: What to announce
      icon: mdi:text-box-outline
      input:
        language:
          name: Language
          default: en
          selector:
            select:
              options:
                - { value: en, label: English }
                - { value: ar, label: Arabic }
    entities:
      name: xBloom entities
      icon: mdi:coffee-maker-outline
      description: The integration creates this; the default is right.
      collapsed: true
      input:
        brew_event_entity:
          name: Brew event
          default: event.xbloom_studio_brew_event
          selector:
            entity:
              domain: event

variables:
  ev: "{{ trigger.to_state.attributes.get('event_type') }}"
  lang: !input language
  method: !input delivery_method
  notify_service: !input notify_service
  # Carried as a variable, not used as `!input` directly in `target:`. Home
  # Assistant validates every `choose` branch at config load, including ones
  # this delivery method will never take — and the empty-string default of an
  # unused tts_engine fails that validation ("expected 'all' or 'none'"),
  # rejecting the whole automation. A template is validated as a string and
  # resolved at runtime, so the unused branch stays inert.
  tts_engine: !input tts_engine
  message: >-
    {%- if lang == 'ar' -%}
      {%- if ev == 'error_no_water' -%}
        الخزان فارغ، أضف ماءً
      {%- elif ev == 'error_no_beans' -%}
        المطحنة فارغة، أضف البن
      {%- elif ev == 'error_dose_water' -%}
        كمية الماء أو البن غير مناسبة
      {%- elif ev == 'error_gear_position' -%}
        المطحنة ليست في موضعها
      {%- endif -%}
    {%- else -%}
      {%- if ev == 'error_no_water' -%}
        The xBloom is out of water. Please refill the tank.
      {%- elif ev == 'error_no_beans' -%}
        No beans detected in the grinder.
      {%- elif ev == 'error_dose_water' -%}
        Water and dose mismatch on the xBloom.
      {%- elif ev == 'error_gear_position' -%}
        Grinder gear error on the xBloom.
      {%- endif -%}
    {%- endif -%}

trigger:
  - platform: state
    entity_id: !input brew_event_entity

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state.attributes.get('event_type') in
         ['error_no_water', 'error_no_beans', 'error_dose_water', 'error_gear_position'] }}

action:
  - choose:
      - conditions: "{{ method == 'alexa' }}"
        sequence:
          - action: notify.alexa_media
            data:
              target: !input speakers
              data:
                type: announce
              message: "{{ message }}"
      - conditions: "{{ method == 'tts' }}"
        sequence:
          - action: tts.speak
            target:
              entity_id: "{{ tts_engine }}"
            data:
              media_player_entity_id: !input speakers
              message: "{{ message }}"
      - conditions: "{{ method == 'notify' }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              message: "{{ message }}"

mode: queued
max: 5
