blueprint:
  name: "xBloom — Brew announcements"
  description: >
    Announces the xBloom brew lifecycle: the brew starting, pouring started,
    paused and resumed, cancelled, and coffee ready — and optionally each pour
    by number. Optionally names the recipe. Bilingual (English / Arabic).

    Speaks through Alexa, any TTS engine and speaker, or any notify service —
    pick one under "How to announce".

    The start announcement fires on the `xbloom_brew_started` bus event, which
    the xbloom.start_brew service emits once the machine has accepted the brew
    — every step taken, including execute. That is the first moment the coffee
    is really coming: a machine that refuses, as it does until it is calibrated
    after a power cut, says nothing instead of announcing a brew that never
    ran. The failure is announced instead, with its reason in your language —
    "the machine is not ready after a power cut", "the tank needs water" — so
    a brew that goes quiet is never a mystery. A recipe Home Assistant sent
    ahead and the machine's button started is announced the same way; one of
    the machine's own recipe slots is announced as started, without a name.
  domain: automation
  author: xbloom-studio-controler
  input:
    xbloom_status_entity:
      name: xBloom Brew Status Sensor
      description: >
        The brew status sensor (domain: sensor) created by the integration —
        typically sensor.xbloom_studio_brew_status. Drives the "started" and
        plain "ready" announcements.
      selector:
        entity:
          domain: sensor
    brew_event_entity:
      name: xBloom Brew Event Entity
      description: >
        The brew event entity (domain: event) — typically
        event.xbloom_studio_brew_event. Only used to read the recipe name when
        "Announce recipe name" is on; select it anyway (it's always present).
      selector:
        entity:
          domain: event
    delivery_method:
      name: How to announce
      description: >
        Alexa — uses the Alexa Media Player integration's announce mode.
        Speaker (TTS) — speaks through a TTS engine on the speakers you pick.
        Notify service — sends the text to any notify service, such as a phone.
        Fill in only the fields for the method you choose; the rest are ignored.
      default: alexa
      selector:
        select:
          options:
            - { value: alexa, label: Alexa }
            - { value: tts, label: Speaker (TTS) }
            - { value: notify, label: Notify service }
    speakers:
      name: Speakers
      description: >
        Used by the Alexa and Speaker (TTS) methods. The media players to speak
        on. For Alexa, pick your Alexa devices. Leave empty for the Notify
        service method.
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true
    pour_speakers:
      name: Speakers for pours
      description: >
        Optional. Where each pour is announced, when "Announce each pour" is
        on — one speaker is usually enough for a line that comes every minute.
        Leave empty to use the speakers above.
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true
    tts_engine:
      name: TTS engine
      description: >
        Used by the Speaker (TTS) method only — the TTS entity to speak with,
        for example tts.google_translate_en_com or tts.piper. Leave empty for
        the other methods.
      default: ""
      selector:
        entity:
          domain: tts
    notify_service:
      name: Notify service
      description: >
        Used by the Notify service method only — the full service name to call,
        for example notify.mobile_app_my_phone or notify.persistent_notification.
        Leave empty for the other methods.
      default: ""
      selector:
        text:
    announce_recipe:
      name: Announce recipe name
      description: >
        When on, the announcements name the recipe — at the start (from the
        xbloom_brew_started event) and on completion (from brew_done) — instead
        of the generic "starting your coffee" / "coffee is ready".
      default: false
      selector:
        boolean: {}
    announce_pours:
      name: Announce each pour
      description: >
        When on, each pour after the first is announced with its number — "pour
        2 of 4" — and the final one as the last pour. The first is already
        announced as the pouring starting.
      default: false
      selector:
        boolean: {}
    paused_entity:
      name: xBloom Brew Paused Sensor
      description: >
        The brew paused sensor (domain: binary_sensor) created by the
        integration — typically binary_sensor.xbloom_studio_brew_paused. Drives
        the paused and resumed announcements, whether the brew was paused on
        the machine or from Home Assistant.
      default: binary_sensor.xbloom_studio_brew_paused
      selector:
        entity:
          domain: binary_sensor
    pour_entity:
      name: xBloom Current Pour Sensor
      description: >
        The current pour sensor (domain: sensor) created by the integration —
        typically sensor.xbloom_studio_current_pour. Only used when "Announce
        each pour" is on.
      default: sensor.xbloom_studio_current_pour
      selector:
        entity:
          domain: sensor
    language:
      name: Announcement language
      description: English or Arabic.
      default: en
      selector:
        select:
          options:
            - { value: en, label: English }
            - { value: ar, label: Arabic }

variables:
  lang: !input language
  announce_recipe: !input announce_recipe
  announce_pours: !input announce_pours
  status_entity: !input xbloom_status_entity
  method: !input delivery_method
  notify_service: !input notify_service
  # Carried as a variable, not used as `!input` directly in `target:`. Home
  # Assistant validates every `choose` branch at config load, including ones
  # this delivery method will never take — and the empty-string default of an
  # unused tts_engine fails that validation ("expected 'all' or 'none'"),
  # rejecting the whole automation. A template is validated as a string and
  # resolved at runtime, so the unused branch stays inert.
  tts_engine: !input tts_engine
  recipe_name: >-
    {%- if trigger.id == 'done_recipe' -%}
      {{ trigger.to_state.attributes.get('recipe_name', '') }}
    {%- elif trigger.id in ['started', 'failed', 'stopped'] -%}
      {{ trigger.event.data.get('recipe_name', '') }}
    {%- else -%}
    {%- endif -%}
  # Why a brew did not run, in one short phrase. The event carries a code and
  # no prose, deliberately — the wording is the consumer's, in its own
  # language. A code not listed here still announces, generically.
  failure: >-
    {%- set reasons = {
      'machine_not_found': ('the machine could not be found', 'تعذر العثور على الجهاز'),
      'bluetooth_error': ('the Bluetooth connection failed', 'فشل الاتصال عبر البلوتوث'),
      'recipe_not_found': ('the recipe could not be found', 'تعذر العثور على الوصفة'),
      'not_configured': ('no machine is set up', 'لا يوجد جهاز مُعد'),
      'machine_busy': ('the machine is busy', 'الآلة مشغولة'),
      'not_ready': ('the machine is not ready after a power cut — put it back on its standby screen',
                    'الآلة غير جاهزة بعد انقطاع الكهرباء، أعدها إلى شاشة الانتظار'),
      'restore_incomplete': ('the machine has not finished recovering — put it back on its standby screen',
                             'لم تكمل الآلة استعادة حالتها، أعدها إلى شاشة الانتظار'),
      'not_on_home_screen': ('the machine is not on its standby screen', 'الآلة ليست على شاشة الانتظار'),
      'no_water': ('the tank needs water', 'الخزان يحتاج إلى ماء'),
      'recipe_rejected': ('the machine did not accept the recipe', 'لم تقبل الآلة الوصفة'),
      'no_reply': ('the machine did not answer', 'لم يرد الجهاز'),
    } -%}
    {%- set reason = trigger.event.data.get('reason', '') if trigger.id == 'failed' else '' -%}
    {%- if reason in reasons -%}
      {{ reasons[reason][1] if lang == 'ar' else reasons[reason][0] }}
    {%- elif reason -%}
      {%- if lang == 'ar' %}توقف التحضير{% else %}the brew stopped{% endif -%}
    {%- endif -%}
  # Everything the automation might say, resolved to one line. An empty result
  # means "this trigger should not announce" and the condition below drops it —
  # which keeps the delivery block a single action instead of one per branch.
  # Alexa's announce mode plays a chime before speaking; its tts mode speaks
  # at once. The lines that come and go during a brew — the pours, pouring
  # started, paused and resumed — are more noise than news with a chime before
  # each, so they are spoken plainly; the start, the end and anything wrong keep
  # it.
  alexa_type: "{{ 'tts' if trigger.id in ['pour', 'pouring', 'paused', 'resumed'] else 'announce' }}"
  all_speakers: !input speakers
  pour_speakers: !input pour_speakers
  targets: >-
    {{ pour_speakers if trigger.id == 'pour' and pour_speakers | length > 0 else all_speakers }}
  message: >-
    {%- if trigger.id == 'started' -%}
      {%- if lang == 'ar' -%}
        {%- if announce_recipe and recipe_name %}بدأ تحضير {{ recipe_name }}{% else %}بدأ تحضير قهوتك{% endif -%}
      {%- else -%}
        {%- if announce_recipe and recipe_name %}Started preparing {{ recipe_name }}{% else %}Starting your coffee{% endif -%}
      {%- endif -%}
    {%- elif trigger.id == 'pouring' -%}
      {%- if lang == 'ar' %}بدأ الصب{% else %}Pouring started{% endif -%}
    {%- elif trigger.id == 'done_simple' and not announce_recipe -%}
      {%- if lang == 'ar' %}قهوتك جاهزة{% else %}Your coffee is ready{% endif -%}
    {%- elif trigger.id == 'done_recipe' and announce_recipe
            and trigger.to_state.attributes.get('event_type') == 'brew_done' -%}
      {%- if lang == 'ar' -%}
        {%- if recipe_name %}انتهى تحضير {{ recipe_name }}{% else %}انتهى تحضير قهوتك{% endif -%}
      {%- else -%}
        {%- if recipe_name %}Finished preparing {{ recipe_name }}{% else %}Your coffee is ready{% endif -%}
      {%- endif -%}
    {#- An empty grinder is the machine's own fault: the fault blueprint speaks
        it the moment the machine reports it, so saying it again here as a
        failed brew would announce one empty hopper twice. -#}
    {%- elif trigger.id == 'failed' and trigger.event.data.get('reason') != 'no_beans' -%}
      {%- if lang == 'ar' -%}
        {%- if announce_recipe and recipe_name %}تعذر تحضير {{ recipe_name }}، {{ failure }}{% else %}تعذر تحضير قهوتك، {{ failure }}{% endif -%}
      {%- else -%}
        {%- if announce_recipe and recipe_name %}Could not brew {{ recipe_name }}: {{ failure }}{% else %}Could not brew your coffee: {{ failure }}{% endif -%}
      {%- endif -%}
    {%- elif trigger.id == 'machine_started' -%}
      {%- if lang == 'ar' %}بدأ التحضير{% else %}Brew started{% endif -%}
    {%- elif trigger.id == 'paused' -%}
      {%- if lang == 'ar' %}التحضير متوقف مؤقتا{% else %}Brew paused{% endif -%}
    {#- The pause also ends when the brew does; only a brew still running
        was resumed. -#}
    {%- elif trigger.id == 'resumed' and states(status_entity) in ['grinding', 'brewing'] -%}
      {%- if lang == 'ar' %}عاد التحضير{% else %}Brew resumed{% endif -%}
    {#- A brew replaced by a newer start is not a cancellation anyone asked
        for; the new brew announces itself. -#}
    {%- elif trigger.id == 'stopped' and trigger.event.data.get('by') != 'superseded' -%}
      {%- if lang == 'ar' -%}
        {%- if announce_recipe and recipe_name %}أُلغي تحضير {{ recipe_name }}{% else %}أُلغي التحضير{% endif -%}
      {%- else -%}
        {%- if announce_recipe and recipe_name %}Cancelled {{ recipe_name }}{% else %}Brew cancelled{% endif -%}
      {%- endif -%}
    {%- elif trigger.id == 'timeout' -%}
      {%- if lang == 'ar' %}لم تعلن الآلة انتهاء التحضير{% else %}The machine never said the brew finished{% endif -%}
    {%- elif trigger.id == 'pour' and announce_pours
            and trigger.to_state.state | int(0) >= 2
            and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) -%}
      {%- set n = trigger.to_state.state | int(0) -%}
      {%- set total = trigger.to_state.attributes.get('total_pours') | int(0) -%}
      {%- if lang == 'ar' -%}
        {%- set ordinals = ['', 'الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة',
                            'السادسة', 'السابعة', 'الثامنة', 'التاسعة', 'العاشرة'] -%}
        {%- set counts = ['', 'واحدة', 'اثنتين', 'ثلاث', 'أربع', 'خمس',
                          'ست', 'سبع', 'ثمان', 'تسع', 'عشر'] -%}
        {#- The last pour is the news — the coffee is nearly ready — so it is
            said as the last rather than by number. Unknown totals never guess. -#}
        {%- if total and n == total -%}
          الصبة الأخيرة
        {%- else -%}
          الصبة {{ ordinals[n] if n <= 10 else n }}{% if 0 < total <= 10 %} من {{ counts[total] }}{% elif total > 10 %} من {{ total }}{% endif %}
        {%- endif -%}
      {%- else -%}
        {%- if total and n == total -%}
          Last pour
        {%- else -%}
          Pour {{ n }}{% if total %} of {{ total }}{% endif %}
        {%- endif -%}
      {%- endif -%}
    {%- endif -%}

trigger:
  # Fired by xbloom.start_brew once the machine has accepted every step,
  # carrying the recipe name — before the burrs move, but never for a brew the
  # machine refused.
  - platform: event
    event_type: xbloom_brew_started
    id: started
  - platform: state
    entity_id: !input xbloom_status_entity
    to: "brewing"
    id: pouring
  - platform: state
    entity_id: !input xbloom_status_entity
    to: "done"
    id: done_simple
  - platform: state
    entity_id: !input brew_event_entity
    id: done_recipe
  # A brew that never ran: the machine refused a step, or Home Assistant could
  # not reach it. Nothing else speaks this — the fault blueprint announces the
  # machine's own fault frames, and a refusal produces none.
  - platform: event
    event_type: xbloom_brew_failed
    id: failed
  # A brew started from one of the machine's own recipe slots: Home Assistant
  # does not know the recipe, so it is announced without a name.
  - platform: event
    event_type: xbloom_machine_brew_started
    id: machine_started
  - platform: state
    entity_id: !input paused_entity
    to: "on"
    id: paused
  - platform: state
    entity_id: !input paused_entity
    from: "on"
    to: "off"
    id: resumed
  # Stopped on the machine or with Cancel Brew: not a failure, but without
  # this the brew would end in silence.
  - platform: event
    event_type: xbloom_brew_stopped
    id: stopped
  - platform: event
    event_type: xbloom_brew_timeout
    id: timeout
  - platform: state
    entity_id: !input pour_entity
    to: ~
    id: pour

condition:
  - condition: template
    value_template: "{{ message | trim != '' }}"

action:
  - choose:
      - conditions: "{{ method == 'alexa' }}"
        sequence:
          - action: notify.alexa_media
            data:
              target: "{{ targets }}"
              data:
                type: "{{ alexa_type }}"
              message: "{{ message }}"
      - conditions: "{{ method == 'tts' }}"
        sequence:
          - action: tts.speak
            target:
              entity_id: "{{ tts_engine }}"
            data:
              media_player_entity_id: "{{ targets }}"
              message: "{{ message }}"
      - conditions: "{{ method == 'notify' }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              message: "{{ message }}"

mode: queued
max: 5
