blueprint:
  name: "xBloom — Brew announcements"
  description: >
    Announces the xBloom brew lifecycle: the brew starting, pouring started, and
    coffee ready. Optionally names the recipe at both ends. Bilingual
    (English / Arabic).

    "Coffee ready" fires on whichever terminal frame the machine sends first —
    `brew_ended` (it stopped pouring) or `brew_done` (RD_ENJOY). Neither frame
    is guaranteed, so waiting for one specific one is wrong in both directions:
    it either announces late or not at all.

    Speaks through Alexa, any TTS engine and speaker, or any notify service —
    pick one under "How to announce".

    The start announcement fires on the `xbloom_brew_started` bus event, which
    the xbloom.start_brew service emits the instant it dispatches — before any
    BLE traffic. That gives immediate confirmation that the intended recipe
    launched, which matters when you cannot see the machine. A brew started
    physically at the machine emits no such event, so it announces from
    "pouring" onward rather than at the start.
  domain: automation
  author: xbloom-studio-controler
  input:
    xbloom_status_entity:
      name: xBloom Brew Status Sensor
      description: >
        The brew status sensor (domain: sensor) created by the integration —
        typically sensor.xbloom_studio_brew_status. Drives the "started" and
        plain "ready" announcements.
      selector:
        entity:
          domain: sensor
    brew_event_entity:
      name: xBloom Brew Event Entity
      description: >
        The brew event entity (domain: event) — typically
        event.xbloom_studio_brew_event. Only used to read the recipe name when
        "Announce recipe name" is on; select it anyway (it's always present).
      selector:
        entity:
          domain: event
    recipe_entity:
      name: xBloom Current Recipe Sensor
      description: >
        Optional — typically sensor.xbloom_studio_current_recipe. The machine's
        `brew_ended` frame carries no recipe name, so this is what lets the
        completion announcement name the coffee at the moment brewing stops
        instead of waiting for `brew_done`. Leave empty to announce the generic
        "your coffee is ready" at that point.
      default: ""
      selector:
        entity:
          domain: sensor
    delivery_method:
      name: How to announce
      description: >
        Alexa — uses the Alexa Media Player integration's announce mode.
        Speaker (TTS) — speaks through a TTS engine on the speakers you pick.
        Notify service — sends the text to any notify service, such as a phone.
        Fill in only the fields for the method you choose; the rest are ignored.
      default: alexa
      selector:
        select:
          options:
            - { value: alexa, label: Alexa }
            - { value: tts, label: Speaker (TTS) }
            - { value: notify, label: Notify service }
    speakers:
      name: Speakers
      description: >
        Used by the Alexa and Speaker (TTS) methods. The media players to speak
        on. For Alexa, pick your Alexa devices. Leave empty for the Notify
        service method.
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true
    tts_engine:
      name: TTS engine
      description: >
        Used by the Speaker (TTS) method only — the TTS entity to speak with,
        for example tts.google_translate_en_com or tts.piper. Leave empty for
        the other methods.
      default: ""
      selector:
        entity:
          domain: tts
    notify_service:
      name: Notify service
      description: >
        Used by the Notify service method only — the full service name to call,
        for example notify.mobile_app_my_phone or notify.persistent_notification.
        Leave empty for the other methods.
      default: ""
      selector:
        text:
    announce_recipe:
      name: Announce recipe name
      description: >
        When on, the announcements name the recipe — at the start (from the
        xbloom_brew_started event) and on completion — instead of the generic
        "starting your coffee" / "coffee is ready". At completion the name comes
        from the `brew_done` event when that is what fired; when the earlier
        `brew_ended` fires first it carries no name, so the Current Recipe
        sensor supplies it.
      default: false
      selector:
        boolean: {}
    language:
      name: Announcement language
      description: English or Arabic.
      default: en
      selector:
        select:
          options:
            - { value: en, label: English }
            - { value: ar, label: Arabic }

variables:
  lang: !input language
  recipe_entity: !input recipe_entity
  # The machine has two terminal frames and NEITHER is guaranteed: `brew_ended`
  # (it stopped pouring) and `brew_done` (RD_ENJOY — "your coffee is ready").
  # 09-02/03/04 sent both, ENJOY 37-70 s after brew_ended; 09-07 sent only
  # ENJOY; 09-09 sent only brew_ended and this automation waited 122 s for an
  # ENJOY that never came. Waiting for one specific frame is therefore wrong in
  # both directions. Announce on whichever arrives FIRST and drop the second:
  # a `brew_done` whose preceding event was `brew_ended` is the same coffee,
  # already announced.
  completed: >-
    {{ trigger.id == 'done_recipe'
       and (trigger.to_state.attributes.get('event_type') == 'brew_ended'
            or (trigger.to_state.attributes.get('event_type') == 'brew_done'
                and (trigger.from_state.attributes.get('event_type')
                     if trigger.from_state else none) != 'brew_ended')) }}
  announce_recipe: !input announce_recipe
  method: !input delivery_method
  notify_service: !input notify_service
  # Carried as a variable, not used as `!input` directly in `target:`. Home
  # Assistant validates every `choose` branch at config load, including ones
  # this delivery method will never take — and the empty-string default of an
  # unused tts_engine fails that validation ("expected 'all' or 'none'"),
  # rejecting the whole automation. A template is validated as a string and
  # resolved at runtime, so the unused branch stays inert.
  tts_engine: !input tts_engine
  recipe_name: >-
    {%- if trigger.id == 'done_recipe' -%}
      {%- set carried = trigger.to_state.attributes.get('recipe_name', '') -%}
      {%- if carried -%}
        {{ carried }}
      {%- elif recipe_entity and states(recipe_entity) not in
               ['unknown', 'unavailable', ''] -%}
        {{ states(recipe_entity) }}
      {%- endif -%}
    {%- elif trigger.id == 'started' -%}
      {{ trigger.event.data.get('recipe_name', '') }}
    {%- else -%}
    {%- endif -%}
  # Everything the automation might say, resolved to one line. An empty result
  # means "this trigger should not announce" and the condition below drops it —
  # which keeps the delivery block a single action instead of one per branch.
  message: >-
    {%- if trigger.id == 'started' -%}
      {%- if lang == 'ar' -%}
        {%- if announce_recipe and recipe_name %}بدأ تحضير {{ recipe_name }}{% else %}بدأ تحضير قهوتك{% endif -%}
      {%- else -%}
        {%- if announce_recipe and recipe_name %}Started preparing {{ recipe_name }}{% else %}Starting your coffee{% endif -%}
      {%- endif -%}
    {%- elif trigger.id == 'pouring' -%}
      {%- if lang == 'ar' %}بدأ صب القهوة{% else %}Pouring started{% endif -%}
    {%- elif completed -%}
      {%- if not announce_recipe -%}
        {%- if lang == 'ar' %}قهوتك في انتظارك{% else %}Your coffee is ready{% endif -%}
      {%- elif lang == 'ar' -%}
        {%- if recipe_name %}انتهى تحضير {{ recipe_name }}{% else %}انتهى تحضير قهوتك{% endif -%}
      {%- else -%}
        {%- if recipe_name %}Finished preparing {{ recipe_name }}{% else %}Your coffee is ready{% endif -%}
      {%- endif -%}
    {%- endif -%}

trigger:
  # Fired by xbloom.start_brew the moment it dispatches, carrying the recipe
  # name — earlier and more informative than waiting for the burrs to move.
  - platform: event
    event_type: xbloom_brew_started
    id: started
  - platform: state
    entity_id: !input xbloom_status_entity
    to: "brewing"
    id: pouring
  - platform: state
    entity_id: !input brew_event_entity
    id: done_recipe

condition:
  - condition: template
    value_template: "{{ message | trim != '' }}"

action:
  - choose:
      - conditions: "{{ method == 'alexa' }}"
        sequence:
          - action: notify.alexa_media
            data:
              target: !input speakers
              data:
                type: announce
              message: "{{ message }}"
      - conditions: "{{ method == 'tts' }}"
        sequence:
          - action: tts.speak
            target:
              entity_id: "{{ tts_engine }}"
            data:
              media_player_entity_id: !input speakers
              message: "{{ message }}"
      - conditions: "{{ method == 'notify' }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              message: "{{ message }}"

mode: queued
max: 5
