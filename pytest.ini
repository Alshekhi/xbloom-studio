# Pytest configuration for the xBloom Studio integration.
#
# This lives in pytest.ini rather than pyproject.toml on purpose: pyproject.toml
# is gitignored (it belongs to the superseded standalone library), so the test
# suite would be unrunnable from a fresh clone if the config lived there.
[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
