start_brew:
  name: Start Brew
  description: >
    Brew a recipe on the xBloom Studio. Uses the recipe selected in
    select.xbloom_studio_recipe unless you pass recipe_name. The dose, ratio,
    and grind_size fields are optional one-off overrides for this brew only —
    the saved recipe is left untouched.
  fields:
    recipe_name:
      name: Recipe name
      description: >
        Brew this recipe instead of the selected one. Must match a name in
        select.xbloom_studio_recipe exactly. Leave blank to use the current
        selection.
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
    share_url:
      name: Share URL
      description: >
        Brew straight from an xBloom app share URL (e.g.
        https://share-h5.xbloom.com/?id=...). Fetched fresh — the recipe does
        not have to be in the library first, and nothing is saved.
      required: false
      selector:
        text:
    share_id:
      name: Share ID
      description: Just the id token (the value after `?id=` in a share URL).
      required: false
      selector:
        text:
    use_preground:
      name: Use pre-ground coffee
      description: >
        Skip the grinder and go straight to pouring, for this brew only. The
        recipe's grind settings are not changed. Handy with pre-ground coffee
        or an external grinder.
      required: false
      default: false
      selector:
        boolean:
    dose:
      name: Dose override (g)
      description: >
        One-off coffee dose in grams. The recipe is rescaled to dose × ratio
        for this brew only. Leave blank to use the recipe's own dose.
      required: false
      example: 18
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: g
    ratio:
      name: Ratio override (1:N)
      description: >
        One-off brew ratio N, where water = dose × N. Rescales the pours for
        this brew only. Leave blank to use the recipe's own ratio.
      required: false
      example: 16
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
    grind_size:
      name: Grind size override
      description: >
        One-off grind size for this brew only (1–80, lower is finer). Leave
        blank to use the recipe's own grind size.
      required: false
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1

stop_brew:
  name: Stop Brew
  description: >
    Cancel the brew in progress. Home Assistant connects over Bluetooth,
    sends the stop command, and disconnects.

brew_standalone:
  name: Standalone Brew
  description: >
    Run the brewer on its own, without a recipe, using the current standalone
    brew entities: number.xbloom_studio_brew_flow_rate,
    number.xbloom_studio_brew_volume, number.xbloom_studio_brew_temperature,
    select.xbloom_studio_brew_pattern, and select.xbloom_studio_water_source.
    Set those first, then call this action.

tare:
  name: Tare Scale
  description: >
    Zero the machine's built-in scale. Home Assistant connects over Bluetooth,
    sends the command, and disconnects.

back_to_home:
  name: Back to Home
  description: >
    Return the machine's on-screen display to the home screen.

brew_pause:
  name: Pause Brew
  description: >
    Pause a brew in progress. The machine holds at the current pour; use
    Resume Brew to carry on.

brew_resume:
  name: Resume Brew
  description: >
    Resume a paused brew.

grind:
  name: Standalone Grind
  description: >
    Run the grinder on its own for a set time. Home Assistant holds the
    Bluetooth link for the full grind, then disconnects.
  fields:
    size:
      name: Grind size
      description: 1–80 (lower is finer). Default 63.
      required: false
      default: 63
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1
    speed:
      name: Grinder speed (RPM)
      description: 60–120. Default 100.
      required: false
      default: 100
      example: 100
      selector:
        number:
          min: 60
          max: 120
          step: 1
    seconds:
      name: Duration (seconds)
      description: How long to grind, 1–30 seconds. Default 5.
      required: false
      default: 5
      example: 5
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: s

set_mode:
  name: Set Mode
  description: >
    Switch the machine between Auto Mode and Pro Mode. "Auto" is the label the
    machine and app use; internally it's the same as EasyMode.
  fields:
    mode:
      name: Mode
      description: >
        auto = Auto Mode: pick a saved recipe (A/B/C) and the machine grinds
        and brews it. pro = Pro Mode: drive the grinder, brewer, and scale
        yourself.
      required: true
      example: auto
      selector:
        select:
          options:
            - auto
            - pro

set_water_source:
  name: Set Water Source
  description: >
    Switch between the internal water tank and an external tap.
  fields:
    source:
      name: Source
      required: true
      example: tank
      selector:
        select:
          options:
            - tank
            - tap

set_temp_unit:
  name: Set Temperature Unit
  description: >
    Set the temperature unit shown on the machine's display.
  fields:
    unit:
      name: Unit
      required: true
      example: c
      selector:
        select:
          options:
            - c
            - f

set_weight_unit:
  name: Set Weight Unit
  description: >
    Set the weight unit shown on the machine's display.
  fields:
    unit:
      name: Unit
      required: true
      example: g
      selector:
        select:
          options:
            - g
            - oz
            - ml

write_slot:
  name: Write Recipe to Slot
  description: >
    Save a recipe to one of the machine's three on-device slots (A / B / C).
    Once written, you can brew it from the machine's own controls with no Home
    Assistant involvement. Pass exactly one of recipe_name, share_url, or
    share_id to choose the recipe; if none is given, the currently selected
    recipe is used.
  fields:
    slot:
      name: Slot
      description: Which on-device slot to overwrite (A, B, or C).
      required: true
      example: A
      selector:
        select:
          options:
            - A
            - B
            - C
    recipe_name:
      name: Recipe name
      description: Name of a recipe in the local library (matches select.xbloom_studio_recipe).
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
    share_url:
      name: Share URL
      description: >
        A share URL from the xBloom iOS app (e.g. https://share-h5.xbloom.com/?id=...).
        Fetched fresh — no need to import it from the Configure menu first.
      required: false
      selector:
        text:
    share_id:
      name: Share ID
      description: Just the id token (the value after `?id=` in a share URL).
      required: false
      selector:
        text:
    scale_on:
      name: Scale enabled
      description: >
        Whether the slot turns on the built-in scale at brew time. Default on.
      required: false
      default: true
      selector:
        boolean:

ble_connect:
  name: BLE Connect (diagnostic)
  description: >
    Test the Bluetooth link: connect, run the handshake, subscribe to
    notifications, then release and disconnect. Each step is logged with a
    success or failure note. For diagnosing connection problems; it doesn't
    touch the brew flow.

ble_disconnect:
  name: BLE Disconnect (diagnostic)
  description: >
    Release any Bluetooth link Home Assistant is holding for the machine, so
    the iOS app can reconnect. The counterpart to BLE Connect.

refresh_status:
  name: Refresh status
  description: >
    Briefly connect to the machine, capture one status update (water, grind
    size, mode, water source, units, voltage), then disconnect — refreshing
    the status sensors on demand without opening a live Connect session. You
    can await it from an automation and then act on the fresh readings.

list_recipes:
  name: List Recipes
  description: >
    Return every recipe in the local library as response data. Call with
    return_response=true (for example from the REST API).

get_recipe:
  name: Get Recipe
  description: >
    Return a single recipe by name as response data, or null if it isn't found.
  fields:
    name:
      name: Recipe name
      description: Exact recipe name (case-sensitive).
      required: true
      example: "Ethiopia Yirgacheffe"
      selector:
        text:

build_recipe:
  name: Build Recipe
  description: >
    Turn loose recipe fields into a brewable recipe. Every value is snapped
    onto the machine's grid rather than rejected — a ratio of 1:16.3 becomes
    1:16.5, a 105 °C pour becomes 98 °C — and the response lists each change
    in plain language, so a caller can tell the user what was adapted.

    Made for callers working from a recipe as a person described it (a web
    recipe, a spoken request) rather than a validated form. Only faults that
    cannot be snapped away — a missing name, more pours than the machine
    accepts, a single pour over 240 ml — come back as errors.

    The response is {ok, recipe, adjustments, errors}. With save: true the
    recipe is stored in the same call: it replaces the recipe named by id
    when one is given, and adds a new one otherwise.
  fields:
    name:
      name: Recipe name
      description: Name for the recipe.
      required: true
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
    dose:
      name: Dose (g)
      description: >
        Coffee dose in grams. Snapped to the chosen cup's range — 15 g exactly
        for an xPod, 5–18 g for the Omni dripper, 5–25 g for Other, 1–5 g for
        Tea. Defaults to the cup's own default.
      required: false
      example: 18
      selector:
        number:
          min: 1
          max: 25
          step: 0.5
          unit_of_measurement: g
    ratio:
      name: Ratio
      description: >
        Brew ratio, as "1:16" or just the number 16. Water is dose × ratio.
        Snapped to the 0.5 grid within 5–25.
      required: false
      example: "1:16"
      selector:
        text:
    grind_size:
      name: Grind size
      description: 1–80, lower is finer. Defaults to 40.
      required: false
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1
    grinder_speed_rpm:
      name: Grinder speed (RPM)
      description: 60–120 in steps of 10. Defaults to 90.
      required: false
      example: 90
      selector:
        number:
          min: 60
          max: 120
          step: 10
    cup_type:
      name: Cup type
      description: >
        The brewer in use, by name or by id — xPod (1), Omni dripper (2),
        Other (3), Tea (4). Defaults to the Omni dripper.
      required: false
      example: "Omni dripper"
      selector:
        text:
    pour_count:
      name: Pour count
      description: >
        How many pours to generate when you don't supply them yourself, 1–9.
        Ignored when pours_json is given. Defaults to 3.
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 9
          step: 1
    pours_json:
      name: Pours JSON
      description: >
        The pours, as a JSON array. Every field is optional and anything left
        out is filled in: [{"volume_ml": 56, "temperature_c": 94,
        "flow_rate": 3.0, "pause_s": 41, "pattern": "spiral",
        "agitate_before": 2, "agitate_after": 2}, ...]. Volumes that don't sum
        to dose × ratio are rescaled proportionally, so the shape of the
        recipe survives. Leave blank to generate pours from pour_count.
      required: false
      selector:
        text:
    id:
      name: Recipe id
      description: >
        The id of an existing recipe. With save, the recipe is replaced rather
        than added — this is how an edit avoids leaving a duplicate behind.
      required: false
      selector:
        text:
    save:
      name: Save
      description: >
        Store the result. Off by default, so you can build a recipe and show
        it to the user before committing to it.
      required: false
      default: false
      selector:
        boolean:
    apply_brew_defaults:
      name: Apply brewing defaults
      description: >
        On by default: the first pour gets a bloom pause targeting a 60-second
        window, later pours pause 10 seconds, and any pause between 1 and 9
        seconds is lifted to 10. These are brewing preferences, not machine
        limits — turn this off to get the machine's own defaults, where an
        unspecified pause is simply zero.
      required: false
      default: true
      selector:
        boolean:

add_recipe:
  name: Add Recipe
  description: >
    Add a new recipe to the local library, replacing any existing recipe with
    the same name. Pass the full recipe as a JSON string.

    The recipe is validated before it's stored, using the same rules as the
    Configure flow (dose range per cup type, ratio 1:5–1:25 in 0.5 steps,
    grind 1–80, RPM 60–120 in steps of 10, per-pour temperature/flow/pattern,
    and pour volumes summing to dose × ratio). If validation fails, nothing is
    written and the response is {ok: false, error: "<summary>",
    errors: {field: reason}}.
  fields:
    recipe_json:
      name: Recipe JSON
      description: The full recipe object as a JSON string.
      required: true
      selector:
        text:

update_recipe:
  name: Update Recipe
  description: >
    Update (replace) an existing recipe by id. Pass the full updated recipe as
    a JSON string. If no recipe with that id exists, it's inserted.

    Validated before writing, exactly like Add Recipe. If validation fails,
    nothing is written and the response is {ok: false, error: "<summary>",
    errors: {field: reason}}.
  fields:
    recipe_json:
      name: Recipe JSON
      description: The full updated recipe object as a JSON string.
      required: true
      selector:
        text:

delete_recipe:
  name: Delete Recipe
  description: >
    Delete a recipe from the local library by name.
  fields:
    name:
      name: Recipe name
      description: Exact recipe name to delete (case-sensitive).
      required: true
      example: "Ethiopia Yirgacheffe"
      selector:
        text:

save_scaled_recipe:
  name: Save Scaled Recipe
  description: >
    The brew customizer's "Save as new recipe": take a recipe, rescale it to
    dose × ratio (with an optional new grind size), and save the result as a
    NEW recipe under new_name — stored locally when signed out, or in the cloud
    with a local mirror when signed in. The source recipe is never changed.
  fields:
    new_name:
      name: New recipe name
      description: Name for the new recipe.
      required: true
      example: "Ethiopia Yirgacheffe (custom)"
      selector:
        text:
    dose:
      name: Dose (g)
      description: Coffee dose in grams for the new recipe.
      required: true
      example: 18
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: g
    ratio:
      name: Ratio (1:N)
      description: Brew ratio N, where water = dose × N, for the new recipe.
      required: true
      example: 16
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
    grind_size:
      name: Grind size
      description: Grind size for the new recipe (1–80, lower is finer).
      required: true
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1
    recipe_name:
      name: Source recipe name
      description: >
        The recipe to scale from. Leave blank to use the currently selected
        recipe (select.xbloom_studio_recipe).
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
