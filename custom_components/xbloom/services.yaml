start_brew:
  name: Start Brew
  description: >
    Brew a recipe on the xBloom Studio. Uses the recipe selected in
    select.xbloom_studio_recipe unless you pass recipe_name. The dose, ratio,
    and grind_size fields are optional one-off overrides for this brew only —
    the saved recipe is left untouched.
  fields:
    recipe_name:
      name: Recipe name
      description: >
        Brew this recipe instead of the selected one. Must match a name in
        select.xbloom_studio_recipe exactly. Leave blank to use the current
        selection.
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
    use_preground:
      name: Use pre-ground coffee
      description: >
        Skip the grinder and go straight to pouring, for this brew only. The
        recipe's grind settings are not changed. Handy with pre-ground coffee
        or an external grinder.
      required: false
      default: false
      selector:
        boolean:
    dose:
      name: Dose override (g)
      description: >
        One-off coffee dose in grams. The recipe is rescaled to dose × ratio
        for this brew only. Leave blank to use the recipe's own dose.
      required: false
      example: 18
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: g
    ratio:
      name: Ratio override (1:N)
      description: >
        One-off brew ratio N, where water = dose × N. Rescales the pours for
        this brew only. Leave blank to use the recipe's own ratio.
      required: false
      example: 16
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
    grind_size:
      name: Grind size override
      description: >
        One-off grind size for this brew only (1–80, lower is finer). Leave
        blank to use the recipe's own grind size.
      required: false
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1

stop_brew:
  name: Stop Brew
  description: >
    Cancel the brew in progress. Home Assistant connects over Bluetooth,
    sends the stop command, and disconnects.

brew_standalone:
  name: Standalone Brew
  description: >
    Run the brewer on its own, without a recipe, using the current standalone
    brew entities: number.brew_flow_rate, number.brew_volume,
    number.brew_temperature, select.brew_pattern, and select.water_source.
    Set those first, then call this action.

tare:
  name: Tare Scale
  description: >
    Zero the machine's built-in scale. Home Assistant connects over Bluetooth,
    sends the command, and disconnects.

back_to_home:
  name: Back to Home
  description: >
    Return the machine's on-screen display to the home screen.

brew_pause:
  name: Pause Brew
  description: >
    Pause a brew in progress. The machine holds at the current pour; use
    Resume Brew to carry on.

brew_resume:
  name: Resume Brew
  description: >
    Resume a paused brew.

grind:
  name: Standalone Grind
  description: >
    Run the grinder on its own for a set time. Home Assistant holds the
    Bluetooth link for the full grind, then disconnects.
  fields:
    size:
      name: Grind size
      description: 1–100 (lower is finer). Default 63.
      required: false
      default: 63
      example: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
    speed:
      name: Grinder speed (RPM)
      description: 60–120. Default 100.
      required: false
      default: 100
      example: 100
      selector:
        number:
          min: 60
          max: 120
          step: 1
    seconds:
      name: Duration (seconds)
      description: How long to grind, 1–30 seconds. Default 5.
      required: false
      default: 5
      example: 5
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: s

set_mode:
  name: Set Mode
  description: >
    Switch the machine between Auto Mode and Pro Mode. "Auto" is the label the
    machine and app use; internally it's the same as EasyMode.
  fields:
    mode:
      name: Mode
      description: >
        auto = Auto Mode: pick a saved recipe (A/B/C) and the machine grinds
        and brews it. pro = Pro Mode: drive the grinder, brewer, and scale
        yourself.
      required: true
      example: auto
      selector:
        select:
          options:
            - auto
            - pro

set_water_source:
  name: Set Water Source
  description: >
    Switch between the internal water tank and an external tap.
  fields:
    source:
      name: Source
      required: true
      example: tank
      selector:
        select:
          options:
            - tank
            - tap

set_temp_unit:
  name: Set Temperature Unit
  description: >
    Set the temperature unit shown on the machine's display.
  fields:
    unit:
      name: Unit
      required: true
      example: C
      selector:
        select:
          options:
            - C
            - F

set_weight_unit:
  name: Set Weight Unit
  description: >
    Set the weight unit shown on the machine's display.
  fields:
    unit:
      name: Unit
      required: true
      example: g
      selector:
        select:
          options:
            - g
            - oz
            - ml

write_slot:
  name: Write Recipe to Slot
  description: >
    Save a recipe to one of the machine's three on-device slots (A / B / C).
    Once written, you can brew it from the machine's own controls with no Home
    Assistant involvement. Pass exactly one of recipe_name, share_url, or
    share_id to choose the recipe; if none is given, the currently selected
    recipe is used.
  fields:
    slot:
      name: Slot
      description: Which on-device slot to overwrite (A, B, or C).
      required: true
      example: A
      selector:
        select:
          options:
            - A
            - B
            - C
    recipe_name:
      name: Recipe name
      description: Name of a recipe in the local library (matches select.xbloom_studio_recipe).
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
    share_url:
      name: Share URL
      description: >
        A share URL from the xBloom iOS app (e.g. https://share-h5.xbloom.com/?id=...).
        Fetched fresh — no need to import it from the Configure menu first.
      required: false
      selector:
        text:
    share_id:
      name: Share ID
      description: Just the id token (the value after `?id=` in a share URL).
      required: false
      selector:
        text:
    scale_on:
      name: Scale enabled
      description: >
        Whether the slot turns on the built-in scale at brew time. Default on.
      required: false
      default: true
      selector:
        boolean:

ble_connect:
  name: BLE Connect (diagnostic)
  description: >
    Test the Bluetooth link: connect, run the handshake, subscribe to
    notifications, then release and disconnect. Each step is logged with a
    success or failure note. For diagnosing connection problems; it doesn't
    touch the brew flow.

ble_disconnect:
  name: BLE Disconnect (diagnostic)
  description: >
    Release any Bluetooth link Home Assistant is holding for the machine, so
    the iOS app can reconnect. The counterpart to BLE Connect.

refresh_status:
  name: Refresh status
  description: >
    Briefly connect to the machine, capture one status update (water, grind
    size, mode, water source, units, voltage), then disconnect — refreshing
    the status sensors on demand without opening a live Connect session. You
    can await it from an automation and then act on the fresh readings.

list_recipes:
  name: List Recipes
  description: >
    Return every recipe in the local library as response data. Call with
    return_response=true (for example from the REST API).

get_recipe:
  name: Get Recipe
  description: >
    Return a single recipe by name as response data, or null if it isn't found.
  fields:
    name:
      name: Recipe name
      description: Exact recipe name (case-sensitive).
      required: true
      example: "Ethiopia Yirgacheffe"
      selector:
        text:

add_recipe:
  name: Add Recipe
  description: >
    Add a new recipe to the local library, replacing any existing recipe with
    the same name. Pass the full recipe as a JSON string.

    The recipe is validated before it's stored, using the same rules as the
    Configure flow (dose range per cup type, ratio 1:5–1:25 in 0.5 steps,
    grind 1–80, RPM 60–120 in steps of 10, per-pour temperature/flow/pattern,
    and pour volumes summing to dose × ratio). If validation fails, nothing is
    written and the response is {ok: false, error: "<summary>",
    errors: {field: reason}}.
  fields:
    recipe_json:
      name: Recipe JSON
      description: The full recipe object as a JSON string.
      required: true
      selector:
        text:

update_recipe:
  name: Update Recipe
  description: >
    Update (replace) an existing recipe by id. Pass the full updated recipe as
    a JSON string. If no recipe with that id exists, it's inserted.

    Validated before writing, exactly like Add Recipe. If validation fails,
    nothing is written and the response is {ok: false, error: "<summary>",
    errors: {field: reason}}.
  fields:
    recipe_json:
      name: Recipe JSON
      description: The full updated recipe object as a JSON string.
      required: true
      selector:
        text:

delete_recipe:
  name: Delete Recipe
  description: >
    Delete a recipe from the local library by name.
  fields:
    name:
      name: Recipe name
      description: Exact recipe name to delete (case-sensitive).
      required: true
      example: "Ethiopia Yirgacheffe"
      selector:
        text:

save_scaled_recipe:
  name: Save Scaled Recipe
  description: >
    The brew customizer's "Save as new recipe": take a recipe, rescale it to
    dose × ratio (with an optional new grind size), and save the result as a
    NEW recipe under new_name — stored locally when signed out, or in the cloud
    with a local mirror when signed in. The source recipe is never changed.
  fields:
    new_name:
      name: New recipe name
      description: Name for the new recipe.
      required: true
      example: "Ethiopia Yirgacheffe (custom)"
      selector:
        text:
    dose:
      name: Dose (g)
      description: Coffee dose in grams for the new recipe.
      required: true
      example: 18
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: g
    ratio:
      name: Ratio (1:N)
      description: Brew ratio N, where water = dose × N, for the new recipe.
      required: true
      example: 16
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
    grind_size:
      name: Grind size
      description: Grind size for the new recipe (1–80, lower is finer).
      required: true
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1
    recipe_name:
      name: Source recipe name
      description: >
        The recipe to scale from. Leave blank to use the currently selected
        recipe (select.xbloom_studio_recipe).
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
