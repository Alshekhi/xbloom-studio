start_brew:
  fields:
    recipe_name:
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
    share_url:
      required: false
      selector:
        text:
    share_id:
      required: false
      selector:
        text:
    use_preground:
      required: false
      default: false
      selector:
        boolean:
    dose:
      required: false
      example: 18
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: g
    ratio:
      required: false
      example: 16
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
    grind_size:
      required: false
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1

stop_brew:
brew_standalone:
tare:
back_to_home:
brew_pause:
brew_resume:
grind:
  fields:
    size:
      required: false
      default: 63
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1
    speed:
      required: false
      default: 100
      example: 100
      selector:
        number:
          min: 60
          max: 120
          step: 1
    seconds:
      required: false
      default: 5
      example: 5
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: s

set_mode:
  fields:
    mode:
      required: true
      example: auto
      selector:
        select:
          options:
            - auto
            - pro

set_water_source:
  fields:
    source:
      required: true
      example: tank
      selector:
        select:
          options:
            - tank
            - tap

set_temp_unit:
  fields:
    unit:
      required: true
      example: c
      selector:
        select:
          options:
            - c
            - f

set_weight_unit:
  fields:
    unit:
      required: true
      example: g
      selector:
        select:
          options:
            - g
            - oz
            - ml

write_slot:
  fields:
    slot:
      required: true
      example: A
      selector:
        select:
          options:
            - A
            - B
            - C
    recipe_name:
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
    share_url:
      required: false
      selector:
        text:
    share_id:
      required: false
      selector:
        text:
    scale_on:
      required: false
      default: true
      selector:
        boolean:

ble_connect:
ble_disconnect:
refresh_status:
list_recipes:
get_recipe:
  fields:
    name:
      required: true
      example: "Ethiopia Yirgacheffe"
      selector:
        text:

