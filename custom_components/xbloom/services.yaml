start_brew:
  fields:
    recipe_name:
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
    share_url:
      required: false
      selector:
        text:
    share_id:
      required: false
      selector:
        text:
    use_preground:
      required: false
      default: false
      selector:
        boolean:
    dose:
      required: false
      example: 18
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: g
    ratio:
      required: false
      example: 16
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
    grind_size:
      required: false
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1
    bean_id:
      required: false
      selector:
        text:
    unattributed:
      required: false
      selector:
        boolean:

stop_brew:
brew_standalone:
tare:
back_to_home:
brew_pause:
brew_resume:
grind:
  fields:
    size:
      required: false
      default: 63
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1
    speed:
      required: false
      default: 100
      example: 100
      selector:
        number:
          min: 60
          max: 120
          step: 1
    seconds:
      required: false
      default: 5
      example: 5
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: s

set_mode:
  fields:
    mode:
      required: true
      example: auto
      selector:
        select:
          options:
            - auto
            - pro

set_water_source:
  fields:
    source:
      required: true
      example: tank
      selector:
        select:
          options:
            - tank
            - tap

set_temp_unit:
  fields:
    unit:
      required: true
      example: c
      selector:
        select:
          options:
            - c
            - f

set_weight_unit:
  fields:
    unit:
      required: true
      example: g
      selector:
        select:
          options:
            - g
            - oz
            - ml

write_slot:
  fields:
    slot:
      required: true
      example: A
      selector:
        select:
          options:
            - A
            - B
            - C
    recipe_name:
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
    share_url:
      required: false
      selector:
        text:
    share_id:
      required: false
      selector:
        text:
    scale_on:
      required: false
      default: true
      selector:
        boolean:

ble_connect:
ble_disconnect:
refresh_status:
list_recipes:
get_recipe:
  fields:
    name:
      required: true
      example: "Ethiopia Yirgacheffe"
      selector:
        text:

build_recipe:
  fields:
    name:
      required: true
      example: "Ethiopia Yirgacheffe"
      selector:
        text:
    dose:
      required: false
      example: 18
      selector:
        number:
          min: 1
          max: 25
          step: 0.5
          unit_of_measurement: g
    ratio:
      required: false
      example: "1:16"
      selector:
        text:
    grind_size:
      required: false
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1
    grinder_speed_rpm:
      required: false
      example: 90
      selector:
        number:
          min: 60
          max: 120
          step: 10
    cup_type:
      required: false
      example: "Omni dripper"
      selector:
        text:
    pour_count:
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 9
          step: 1
    pours_json:
      required: false
      selector:
        text:
    id:
      required: false
      selector:
        text:
    save:
      required: false
      default: false
      selector:
        boolean:
    apply_brew_defaults:
      required: false
      default: true
      selector:
        boolean:

add_recipe:
  fields:
    recipe_json:
      required: true
      selector:
        text:

update_recipe:
  fields:
    recipe_json:
      required: true
      selector:
        text:

delete_recipe:
  fields:
    name:
      required: true
      example: "Ethiopia Yirgacheffe"
      selector:
        text:

save_scaled_recipe:
  fields:
    new_name:
      required: true
      example: "Ethiopia Yirgacheffe (custom)"
      selector:
        text:
    dose:
      required: true
      example: 18
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          unit_of_measurement: g
    ratio:
      required: true
      example: 16
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
    grind_size:
      required: true
      example: 50
      selector:
        number:
          min: 1
          max: 80
          step: 1
    recipe_name:
      required: false
      example: "Ethiopia Yirgacheffe"
      selector:
        text:

# Coffee Lab — registered only while it is switched on. Names and
# descriptions are in strings.json, so they are translated.
set_active_bean:
  fields:
    bean:
      selector:
        text:
    bean_id:
      selector:
        text:

consume:
  fields:
    bean:
      selector:
        text:
    bean_id:
      selector:
        text:
    grams:
      required: true
      selector:
        number:
          min: 0
          max: 2000
          step: 0.1
          unit_of_measurement: g
          mode: box
    brewer:
      selector:
        text:

start_tracking:
  fields:
    bean:
      selector:
        text:
    bean_id:
      selector:
        text:
    grams:
      required: true
      selector:
        number:
          min: 0
          max: 2000
          step: 0.1
          unit_of_measurement: g
          mode: box

finish_bag:
  fields:
    bean:
      selector:
        text:
    bean_id:
      selector:
        text:

add_bean:
  fields:
    name:
      required: true
      selector:
        text:
    remaining_g:
      selector:
        number:
          min: 0
          max: 5000
          step: 0.1
          unit_of_measurement: g
          mode: box
    bag_size_g:
      selector:
        number:
          min: 0
          max: 5000
          step: 1
          unit_of_measurement: g
          mode: box
    status:
      selector:
        select:
          translation_key: bag_status
          options:
            - unopened
            - open
            - finished
            - archived
    roaster:
      selector:
        text:
    country:
      selector:
        text:
    region:
      selector:
        text:
    process:
      selector:
        text:
    roaster_notes:
      selector:
        text:
          multiline: true

update_bean:
  fields:
    bean:
      selector:
        text:
    bean_id:
      selector:
        text:
    new_name:
      selector:
        text:
    bag_size_g:
      selector:
        number:
          min: 0
          max: 5000
          step: 1
          unit_of_measurement: g
          mode: box
    status:
      selector:
        select:
          translation_key: bag_status
          options:
            - unopened
            - open
            - finished
            - archived
    roaster:
      selector:
        text:
    country:
      selector:
        text:
    region:
      selector:
        text:
    process:
      selector:
        text:
    roaster_notes:
      selector:
        text:
          multiline: true
