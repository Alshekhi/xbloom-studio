blueprint:
  name: "xBloom — Live-session announcements"
  description: >
    Speaks what happens at the machine while Connect is on, in English or
    Arabic: the knobs you turn, the screen you move to, the scale weight, a
    recipe card read, a picked recipe reaching the machine, and the connection
    itself.
  domain: automation
  author: xbloom-studio-controler
  source_url: https://github.com/Alshekhi/xbloom-studio/blob/main/custom_components/xbloom/blueprints/live_control_announce.yaml
  homeassistant:
    min_version: 2024.6.0
  input:
    delivery:
      name: How to announce
      icon: mdi:bullhorn
      input:
        delivery_method:
          name: Announce with
          description: >
            Alexa uses the Alexa Media Player integration. Speaker (TTS) speaks
            through a TTS engine. Notification sends the text to a notify
            service, such as a phone. Fill in only the fields for the one you
            choose.
          default: alexa
          selector:
            select:
              options:
                - { value: alexa, label: Alexa }
                - { value: tts, label: Speaker (TTS) }
                - { value: notify, label: Notification }
        speakers:
          name: Speakers
          description: Where the readings are spoken.
          default: []
          selector:
            entity:
              domain: media_player
              multiple: true
        tts_engine:
          name: TTS engine
          description: For Speaker (TTS) only, for example tts.piper.
          default: ""
          selector:
            entity:
              domain: tts
        notify_service:
          name: Notify service
          description: >
            For Notification only, for example notify.mobile_app_my_phone.
          default: ""
          selector:
            text:
    content:
      name: What to announce
      icon: mdi:text-box-outline
      input:
        language:
          name: Language
          default: en
          selector:
            select:
              options:
                - { value: en, label: English }
                - { value: ar, label: Arabic }
        quiet_connect_for_recipe:
          name: Stay quiet about connecting for a picked recipe
          description: >
            Only the recipe reaching the machine is announced, not the
            connection opened to send it. Turning Connect on yourself is
            always announced.
          default: true
          selector:
            boolean: {}

variables:
  lang: !input language
  method: !input delivery_method
  quiet_connect_for_recipe: !input quiet_connect_for_recipe
  quiet_for_recipe: >-
    {{ (trigger.event.data.for_recipe | default(false)) and quiet_connect_for_recipe }}
  notify_service: !input notify_service
  # Carried as a variable, not used as `!input` directly in `target:`. Home
  # Assistant validates every `choose` branch at config load, including ones
  # this delivery method will never take — and the empty-string default of an
  # unused tts_engine fails that validation ("expected 'all' or 'none'"),
  # rejecting the whole automation. A template is validated as a string and
  # resolved at runtime, so the unused branch stays inert.
  tts_engine: !input tts_engine
  ev: "{{ trigger.event.event_type }}"
  recipe_name: "{{ trigger.event.data.recipe_name | default('') }}"
  # How the recipe that reached the machine differs from it as saved, as one
  # phrase of only the new values: "dose 15 grams, water 248 millilitres".
  changes_said: >-
    {%- set c = trigger.event.data.changes | default({}) if ev == 'xbloom_recipe_prepared' else {} -%}
    {%- macro num(v) -%}{{ (v | float | int) if (v | float) == (v | float | int) else (v | float | round(1)) }}{%- endmacro -%}
    {%- set parts = namespace(items=[]) -%}
    {%- if 'dose' in c -%}
      {%- set d = c.dose.now | float -%}
      {#- Three to ten whole grams take the plural, as Arabic counts. -#}
      {%- set unit = ' جرامات' if d == d | int and 3 <= d <= 10 else ' جرام' -%}
      {%- set parts.items = parts.items + [('الجرعة ' ~ num(d) ~ unit) if lang == 'ar' else ('dose ' ~ num(d) ~ ' grams')] -%}
    {%- endif -%}
    {%- if 'water' in c -%}
      {%- set parts.items = parts.items + [('الماء ' ~ num(c.water.now) ~ ' مليلتر') if lang == 'ar' else ('water ' ~ num(c.water.now) ~ ' millilitres')] -%}
    {%- endif -%}
    {%- if 'ratio' in c -%}
      {%- set parts.items = parts.items + [('النسبة 1 إلى ' ~ num(c.ratio.now)) if lang == 'ar' else ('ratio 1 to ' ~ num(c.ratio.now))] -%}
    {%- endif -%}
    {%- if 'grind_size' in c -%}
      {%- set parts.items = parts.items + [('الطحن ' ~ num(c.grind_size.now)) if lang == 'ar' else ('grind ' ~ num(c.grind_size.now))] -%}
    {%- endif -%}
    {%- if 'use_grinder' in c -%}
      {%- if c.use_grinder.now -%}
        {%- set parts.items = parts.items + ['المطحنة تعمل' if lang == 'ar' else 'grinder on'] -%}
      {%- else -%}
        {%- set parts.items = parts.items + ['المطحنة متوقفة' if lang == 'ar' else 'grinder off'] -%}
      {%- endif -%}
    {%- endif -%}
    {%- if lang == 'ar' -%}
      {{ parts.items[:1] | join('') }}{% for p in parts.items[1:] %}، و{{ p }}{% endfor %}
    {%- else -%}
      {{ parts.items | join(', ') }}
    {%- endif -%}
  reason: "{{ trigger.event.data.reason | default('') }}"
  reason_pretty: "{{ reason | replace('_', ' ') }}"
  # Why a picked recipe did not reach the machine, in one short phrase. The
  # same reason codes as a brew that could not start.
  not_prepared: >-
    {%- set reasons = {
      'machine_not_found': ('the device could not be found', 'تعذر العثور على الجهاز'),
      'bluetooth_error': ('the Bluetooth connection failed', 'فشل الاتصال عبر البلوتوث'),
      'machine_busy': ('the machine is busy', 'الآلة مشغولة'),
      'not_ready': ('the machine is not ready after a power cut', 'الآلة غير جاهزة بعد انقطاع الكهرباء'),
      'restore_incomplete': ('the machine has not finished recovering', 'لم تكمل الآلة استعادة حالتها'),
      'not_on_home_screen': ('the machine is not on its standby screen', 'الآلة ليست على شاشة الانتظار'),
      'no_water': ('the tank needs water', 'الخزان يحتاج إلى ماء'),
      'recipe_rejected': ('the machine did not accept the recipe', 'لم تقبل الآلة الوصفة'),
      'no_reply': ('the device did not answer', 'لم يرد الجهاز'),
    } -%}
    {%- if reason in reasons -%}{{ reasons[reason][1] if lang == 'ar' else reasons[reason][0] }}{%- endif -%}
  # weight
  weight: "{{ trigger.event.data.weight_g | default(0) | round(1) }}"
  # grinder knob
  param: "{{ trigger.event.data.parameter | default('') }}"
  # brewer setting
  setting: "{{ trigger.event.data.setting | default('') }}"
  value: "{{ trigger.event.data.value | default(0) }}"
  value_name: "{{ trigger.event.data.value_name | default('') }}"
  # module entry
  module: "{{ trigger.event.data.module | default('') }}"
  # mode change (Auto/Pro switched from the dashboard/service)
  mode: "{{ trigger.event.data.mode | default('') }}"
  # derived: pour pattern name (correct order — 0 centered / 1 circular / 2 spiral)
  pattern_ar: >-
    {% if value_name == 'centered' or value == 0 %}مركزي
    {%- elif value_name == 'circular' or value == 1 %}دائري
    {%- elif value_name == 'spiral' or value == 2 %}لولبي
    {%- else %}نمط {{ value }}{% endif %}
  pattern_en: >-
    {% if value_name == 'centered' or value == 0 %}centered
    {%- elif value_name == 'circular' or value == 1 %}circular
    {%- elif value_name == 'spiral' or value == 2 %}spiral
    {%- else %}pattern {{ value }}{% endif %}
  # derived: brew ratio formatted without a trailing .0 (15.0 -> 15, 16.5 -> 16.5)
  ratio_fmt: >-
    {% set r = value | float %}{{ (r | round(0) | int) if r == (r | round(0)) else (r | round(1)) }}
  message: >-
    {%- if lang == 'ar' -%}
      {%- if ev in ['xbloom_connect_connecting', 'xbloom_connect_ready'] and quiet_for_recipe -%}
      {%- elif ev == 'xbloom_connect_connecting' -%}
        جارٍ الاتصال بإكس بلوم
      {%- elif ev == 'xbloom_connect_ready' -%}
        إكس بلوم متصلة
      {%- elif ev == 'xbloom_connect_failed' -%}
        تعذر الاتصال بإكس بلوم{% if reason == 'machine_not_found' %}، تعذر العثور على الجهاز{% elif reason == 'machine_busy' %}، الجهاز مشغول{% elif reason == 'connection_lost' %}، انقطع الاتصال{% endif %}
      {%- elif ev == 'xbloom_connect_auto_stopped' -%}
        أُغلق الاتصال بإكس بلوم
      {%- elif ev == 'xbloom_scale_weight_stable' -%}
        الوزن {{ weight }} جرام
      {%- elif ev == 'xbloom_grinder_knob_changed' -%}
        {% if param == 'size' %}درجة الطحن {{ value }}{% elif param == 'speed' %}سرعة الطحن {{ value }}{% endif %}
      {%- elif ev == 'xbloom_brewer_setting_changed' -%}
        {% if setting == 'temperature' %}{% if value_name == 'RT' %}درجة حرارة الغرفة{% elif value_name == 'BP' %}درجة الغليان{% else %}درجة الحرارة {% if states('select.xbloom_studio_temperature_unit') == 'f' %}{{ (value | float * 1.8 + 32) | round(0) | int }} فهرنهايت{% else %}{{ value }} مئوية{% endif %}{% endif %}{% elif setting == 'pattern' %}نمط الصب {{ pattern_ar }}{% elif setting == 'size' %}درجة الطحن {{ value }}{% elif setting == 'speed' %}سرعة الطحن {{ value }}{% elif setting == 'ratio' %}النسبة {{ ratio_fmt }}{% endif %}
      {%- elif ev == 'xbloom_module_entered' -%}
        {% if module == 'scale' %}الميزان{% elif module == 'grinder' %}المطحنة{% elif module == 'brewer' %}وحدة الصب{% elif module == 'home' %}الشاشة الرئيسية{% elif module == 'auto' %}الوضع التلقائي{% endif %}
      {%- elif ev == 'xbloom_mode_changed' -%}
        {% if mode == 'auto' %}الوضع التلقائي{% elif mode == 'pro' %}الوضع الاحترافي{% endif %}
      {%- elif ev == 'xbloom_scale_tared' -%}
        الميزان على الصفر
      {%- elif ev == 'xbloom_recipe_card_scanned' -%}
        قُرئت بطاقة الوصفة
      {%- elif ev == 'xbloom_recipe_prepared' -%}
        {% if recipe_name and changes_said %}وصلت وصفة {{ recipe_name }}، {{ changes_said }}{% elif recipe_name %}وصلت وصفة {{ recipe_name }} إلى الآلة{% elif changes_said %}وصلت الوصفة، {{ changes_said }}{% else %}وصلت الوصفة إلى الآلة{% endif %}
      {%- elif ev == 'xbloom_recipe_not_prepared' -%}
        تعذر إرسال الوصفة إلى الآلة{% if not_prepared %}، {{ not_prepared }}{% endif %}
      {%- endif -%}
    {%- else -%}
      {%- if ev in ['xbloom_connect_connecting', 'xbloom_connect_ready'] and quiet_for_recipe -%}
      {%- elif ev == 'xbloom_connect_connecting' -%}
        Connecting to xBloom
      {%- elif ev == 'xbloom_connect_ready' -%}
        Connected to xBloom
      {%- elif ev == 'xbloom_connect_failed' -%}
        Failed to connect to xBloom{% if reason == 'machine_not_found' %}, device not found{% elif reason == 'machine_busy' %}, device busy{% elif reason == 'connection_lost' %}, connection lost{% endif %}
      {%- elif ev == 'xbloom_connect_auto_stopped' -%}
        xBloom connection timed out
      {%- elif ev == 'xbloom_scale_weight_stable' -%}
        {{ weight }} grams
      {%- elif ev == 'xbloom_grinder_knob_changed' -%}
        {% if param == 'size' %}Grind size {{ value }}{% elif param == 'speed' %}Grind speed {{ value }}{% endif %}
      {%- elif ev == 'xbloom_brewer_setting_changed' -%}
        {% if setting == 'temperature' %}{% if value_name == 'RT' %}Room temperature{% elif value_name == 'BP' %}Boiling point{% else %}Temperature {% if states('select.xbloom_studio_temperature_unit') == 'f' %}{{ (value | float * 1.8 + 32) | round(0) | int }} Fahrenheit{% else %}{{ value }} Celsius{% endif %}{% endif %}{% elif setting == 'pattern' %}Pour pattern {{ pattern_en }}{% elif setting == 'size' %}Grind size {{ value }}{% elif setting == 'speed' %}Grind speed {{ value }}{% elif setting == 'ratio' %}Ratio one to {{ ratio_fmt }}{% endif %}
      {%- elif ev == 'xbloom_module_entered' -%}
        {% if module == 'scale' %}Scale{% elif module == 'grinder' %}Grinder{% elif module == 'brewer' %}Brewer{% elif module == 'home' %}Home screen{% elif module == 'auto' %}Auto mode{% endif %}
      {%- elif ev == 'xbloom_mode_changed' -%}
        {% if mode == 'auto' %}Auto mode{% elif mode == 'pro' %}Pro mode{% endif %}
      {%- elif ev == 'xbloom_scale_tared' -%}
        Scale zeroed
      {%- elif ev == 'xbloom_recipe_card_scanned' -%}
        Recipe card scanned
      {%- elif ev == 'xbloom_recipe_prepared' -%}
        {% if recipe_name %}{{ recipe_name }} is ready on the machine{% else %}The recipe is ready on the machine{% endif %}{% if changes_said %}: {{ changes_said }}{% endif %}
      {%- elif ev == 'xbloom_recipe_not_prepared' -%}
        Could not send the recipe to the machine{% if not_prepared %}: {{ not_prepared }}{% endif %}
      {%- endif -%}
    {%- endif -%}

trigger:
  - platform: event
    event_type:
      - xbloom_connect_connecting
      - xbloom_connect_ready
      - xbloom_connect_failed
      - xbloom_connect_auto_stopped
      - xbloom_scale_weight_stable
      - xbloom_grinder_knob_changed
      - xbloom_brewer_setting_changed
      - xbloom_module_entered
      - xbloom_mode_changed
      - xbloom_scale_tared
      - xbloom_recipe_card_scanned
      # Fired once the machine has accepted a recipe sent ahead of its start.
      - xbloom_recipe_prepared
      - xbloom_recipe_not_prepared

condition:
  - condition: template
    value_template: "{{ message | trim != '' }}"

action:
  - choose:
      - conditions: "{{ method == 'alexa' }}"
        sequence:
          - action: notify.alexa_media
            data:
              target: !input speakers
              data:
                type: tts
              message: "{{ message }}"
      - conditions: "{{ method == 'tts' }}"
        sequence:
          - action: tts.speak
            target:
              entity_id: "{{ tts_engine }}"
            data:
              media_player_entity_id: !input speakers
              message: "{{ message }}"
      - conditions: "{{ method == 'notify' }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              message: "{{ message }}"

mode: queued
max: 10
