blueprint:
  name: "xBloom — Ask how the coffee was"
  description: >
    Asks how each coffee was, a quarter of an hour after the last cup, once for
    cups brewed close together: on a phone, with Again / Fine / Not again
    buttons that keep the verdict, or aloud through a voice assistant, whose
    conversation agent keeps the answer and anything said about the taste. The
    voice assistant's agent needs the xBloom Studio tools turned on. An answer
    given on the dashboard or to another assistant first is not asked again.
  domain: automation
  author: xbloom-studio-controler
  source_url: https://github.com/Alshekhi/xbloom-studio/blob/main/custom_components/xbloom/blueprints/rating_ask.yaml
  homeassistant:
    min_version: 2025.4.0
  input:
    delivery:
      name: How to ask
      icon: mdi:star-outline
      input:
        ask_with:
          name: Ask with
          description: >
            Phone sends a notification with buttons through the Home Assistant
            companion app. Voice assistant asks aloud and listens for the
            answer. Fill in only the field for the one you choose.
          default: phone
          selector:
            select:
              options:
                - { value: phone, label: Phone }
                - { value: voice, label: Voice assistant }
        notify_service:
          name: Phone
          description: >
            For Phone only: the companion app's notify action, for example
            notify.mobile_app_my_phone.
          default: ""
          selector:
            text:
        satellite:
          name: Voice assistant
          description: For Voice assistant only.
          default: ""
          selector:
            entity:
              domain: assist_satellite
    content:
      name: What to say
      icon: mdi:text-box-outline
      input:
        language:
          name: Language
          default: en
          selector:
            select:
              options:
                - { value: en, label: English }
                - { value: ar, label: Arabic }

variables:
  lang: !input language
  method: !input ask_with
  # Carried as variables, not used as `!input` directly in `target:` or as an
  # action name: Home Assistant validates every `choose` branch at load,
  # including the one this delivery method never takes, and an empty default
  # there would reject the whole automation.
  notify_service: !input notify_service
  satellite: !input satellite
  prefix: XBLOOM_RATE
  verdicts: [again, fine, not_again]
  labels: >-
    {{ {'again': 'أكرّرها', 'fine': 'لا بأس بها', 'not_again': 'لن أكرّرها'} if lang == 'ar'
       else {'again': 'Again', 'fine': 'Fine', 'not_again': 'Not again'} }}
  # Each coffee in words, as the dashboard's card says it.
  coffees: >-
    {%- set ns = namespace(out=[]) -%}
    {%- for b in (trigger.event.data.brews if trigger.id == 'due' else []) -%}
      {%- set cs = namespace(out=[]) -%}
      {%- for c in b.changes or [] -%}
        {%- set v = (c.value | float) | round(1) | string | replace('.0', '') -%}
        {%- set s = (c.saved | float) | round(1) | string | replace('.0', '') -%}
        {%- if lang == 'ar' -%}
          {%- set w = 'بدرجة طحن ' ~ v ~ ' بدل ' ~ s if c.setting == 'grind'
                 else 'بنسبة 1:' ~ v ~ ' بدل 1:' ~ s if c.setting == 'ratio'
                 else 'بجرعة ' ~ v ~ ' غ بدل ' ~ s ~ ' غ' -%}
        {%- else -%}
          {%- set w = 'grind ' ~ v ~ ' instead of ' ~ s if c.setting == 'grind'
                 else 'ratio 1:' ~ v ~ ' instead of 1:' ~ s if c.setting == 'ratio'
                 else v ~ ' g instead of ' ~ s ~ ' g' -%}
        {%- endif -%}
        {%- set cs.out = cs.out + [w] -%}
      {%- endfor -%}
      {%- set sep = '، ' if lang == 'ar' else ', ' -%}
      {%- set changed = (sep ~ cs.out | join(sep)) if cs.out else '' -%}
      {#- Names can come from the community hub, written by anyone: only
          letters, digits and plain punctuation, and short. -#}
      {%- set recipe = (b.recipe | string | regex_replace("[^\\w\\s'&().,-]", '') | trim)[:40] -%}
      {%- set bag = (b.bag | string | regex_replace("[^\\w\\s'&().,-]", '') | trim)[:40] -%}
      {%- set words = (recipe ~ ' مع ' ~ bag ~ changed) if lang == 'ar'
                      else (recipe ~ ' with ' ~ bag ~ changed) -%}
      {%- set ns.out = ns.out + [{'brew_id': b.brew_id | string | regex_replace('[^A-Za-z0-9-]', ''),
                                   'words': words}] -%}
    {%- endfor -%}
    {{ ns.out }}

trigger:
  - platform: event
    event_type: xbloom_rating_due
    id: due
  # A tap on one of the phone notification's buttons.
  - platform: event
    event_type: mobile_app_notification_action
    id: answer

condition:
  - condition: template
    value_template: >
      {% if trigger.id == 'due' %}{{ coffees | count > 0 and
         ((method == 'phone' and notify_service | trim != '') or
          (method == 'voice' and satellite | trim != '')) }}
      {% else %}{% set a = (trigger.event.data.action or '').split('|') %}
      {{ method == 'phone' and a | count == 3 and a[0] == prefix and a[1] in verdicts }}{% endif %}

action:
  - choose:
      - conditions: "{{ trigger.id == 'answer' }}"
        sequence:
          - variables:
              answer: "{{ trigger.event.data.action.split('|') }}"
          - action: xbloom.rate_brew
            data:
              brew_id: "{{ answer[2] }}"
              verdict: "{{ answer[1] }}"
      - conditions: "{{ method == 'phone' }}"
        sequence:
          # One notification a coffee, each with its own buttons.
          - repeat:
              for_each: "{{ coffees }}"
              sequence:
                - action: "{{ notify_service }}"
                  data:
                    message: >-
                      {{ ('كيف كانت ' ~ repeat.item.words ~ '؟') if lang == 'ar'
                         else ('How was ' ~ repeat.item.words ~ '?') }}
                    data:
                      tag: "xbloom-rating-{{ repeat.item.brew_id }}"
                      actions: >-
                        {%- set ns = namespace(out=[]) -%}
                        {%- for v in verdicts -%}
                          {%- set ns.out = ns.out + [{'action': prefix ~ '|' ~ v ~ '|' ~ repeat.item.brew_id,
                                                       'title': labels[v]}] -%}
                        {%- endfor -%}
                        {{ ns.out }}
      - conditions: "{{ method == 'voice' }}"
        sequence:
          - action: assist_satellite.start_conversation
            target:
              entity_id: "{{ satellite }}"
            data:
              start_message: >-
                {%- set ws = coffees | map(attribute='words') | list -%}
                {%- if lang == 'ar' -%}
                  {{ 'كيف كانت ' ~ ws[0] ~ '؟' if ws | count == 1
                     else 'كيف كانت قهوتك؟ ' ~ ws | join('، و') ~ '.' }}
                {%- else -%}
                  {{ 'How was ' ~ ws[0] ~ '?' if ws | count == 1
                     else 'How were your coffees? ' ~ ws | join(', and ') ~ '.' }}
                {%- endif -%}
              # Only ids, in the order the question named the coffees: no
              # name reaches the agent's instructions.
              extra_system_prompt: >-
                You have just asked how
                {{ 'this coffee was' if coffees | count == 1 else 'these coffees were, in this order' }}.
                Their brew_ids, in the same order:
                {{ coffees | map(attribute='brew_id') | join(', ') }}. For each
                coffee the person talks about, keep only what they say, in their
                words, with the coffee_lab tool's rate_brew for that brew_id:
                the verdict (again, fine or not_again), what was wrong if they
                say it was sour, bitter, too weak or too strong (issue: sour,
                bitter, weak or strong), and anything about how it tasted.
                Do nothing else with this conversation unless they
                ask. Never fill in what they did not say, and never read an id
                aloud. If they would rather not answer, leave it.

mode: parallel
max: 10
