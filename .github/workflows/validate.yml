name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Re-run weekly so upstream HACS / hassfest rule changes are caught early.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  no-vendoring:
    name: no vendored library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail if the protocol library is vendored again
        # The library is xbloom-py, installed from PyPI via manifest
        # requirements. It used to live in-tree, and a second, drifting copy of
        # its rules grew in a downstream consumer as a direct result. Copying a
        # module back in would pass every other check here, so this is the one
        # that has to notice.
        run: |
          if [ -d custom_components/xbloom/vendor ]; then
            echo "::error::custom_components/xbloom/vendor/ is back. The protocol library is xbloom-py, installed from PyPI — see manifest.json requirements."
            exit 1
          fi
          if grep -rn --include='*.py' -E 'from +\.+vendor|import +\.*vendor' custom_components/; then
            echo "::error::Something under custom_components/ imports a vendored library path."
            exit 1
          fi
          echo "No vendored library. The component imports xbloom from the installed package."

  no-personal-data:
    name: describes the software, not its users
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if a file or a new commit message names a user or a private setup
        # This repository is public. Comments that explain a behaviour by who
        # uses the software, anything naming the maintainer's own machine,
        # account or network, and explanations written in terms of a private
        # setup rather than the repository, have all reached it before and had
        # to be removed afterwards — which does not remove them from the
        # history. Every sentence here can be written about what the software
        # does, or what the change does, instead.
        # LICENSE and the codeowner are deliberate credits and are exempt.
        run: |
          set -u
          PAT='voiceover|screen.reader|blind (user|person)|/Users/|[0-9A-F]{2}:79:C4:[0-9A-F]{2}|59A022|J15A01G'
          PAT="$PAT"'|personal|my (machine|setup|install|own|house)|local tooling|\bindexer\b|household'
          fail=0
          if git grep -n -i -E "$PAT" -- . ':!LICENSE' ':!.github/workflows/validate.yml'; then
            echo "::error::A tracked file describes a user or a private setup. Say what the software does instead."
            fail=1
          fi
          range=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          if [ -n "$range" ] && git log --format='%h %s%n%b' "$range" | grep -n -i -E "$PAT"; then
            echo "::error::A commit message in this push names a user or a private setup. Reword it before it is published."
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "Nothing here describes anyone."

  pins-agree:
    name: library pin agrees
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: manifest.json and requirements-test.txt must name the same version
        # Home Assistant installs what manifest.json pins; CI tests what
        # requirements-test.txt pins. Bump one and forget the other and the
        # suite stays green over a version nobody runs — a silent failure,
        # because nothing goes red until a user hits code CI never exercised.
        run: |
          manifest=$(python -c "import json;print(json.load(open('custom_components/xbloom/manifest.json'))['requirements'][0].split('==')[1])")
          tests=$(grep -oE '^xbloom-py(\[[a-z,]+\])?==[0-9][^ ]*' requirements-test.txt | head -1 | sed 's/.*==//')
          echo "manifest.json:          $manifest"
          echo "requirements-test.txt:  $tests"
          if [ -z "$manifest" ] || [ -z "$tests" ]; then
            echo "::error::Could not read one of the pins. Has the format changed?"
            exit 1
          fi
          if [ "$manifest" != "$tests" ]; then
            echo "::error::xbloom-py pin mismatch — manifest.json says $manifest, requirements-test.txt says $tests."
            exit 1
          fi
          echo "Both pin xbloom-py $manifest."

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match Home Assistant's runtime. The suite stubs homeassistant
          # itself, so this pins the language version, not an HA release.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run tests
        # No -x: a green/red summary of the whole suite is more useful on a PR
        # than stopping at the first failure.
        run: pytest tests/ -q
