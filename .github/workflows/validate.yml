name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Re-run weekly so upstream HACS / hassfest rule changes are caught early.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match Home Assistant's runtime. The suite stubs homeassistant
          # itself, so this pins the language version, not an HA release.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run tests
        # No -x: a green/red summary of the whole suite is more useful on a PR
        # than stopping at the first failure.
        run: pytest tests/ -q
